<style>
    .navbar {
        --_pad: .85rem 1rem;
        background: var(--color-bg, #fff);
        border-bottom: 1px solid var(--color-border, #e5e7eb);
        font-family: system-ui, sans-serif;
    }

    .nav-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: var(--_pad);
    }

    .brand {
        font-weight: 700;
        font-size: 1.15rem;
        text-decoration: none;
        color: var(--color-text, #111);
        letter-spacing: .5px;
    }

    .brand span {
        color: var(--color-primary, #2563eb);
    }

    .nav-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: 1px solid var(--color-border, #d1d5db);
        padding: .4rem .65rem;
        border-radius: 6px;
        font-size: 1.05rem;
        cursor: pointer;
    }

    .nav-menu {
        list-style: none;
        display: flex;
        gap: 1.1rem;
        margin: 0;
        padding: 0;
        align-items: center;
    }

    .nav-menu a {
        text-decoration: none;
        font-size: .9rem;
        color: var(--color-text-dim, #374151);
        font-weight: 500;
    }

    .nav-menu a:hover {
        color: var(--color-text, #111);
    }

    .btn.primary.small {
        background: var(--color-primary, #2563eb);
        color: #fff;
        padding: .55rem .85rem;
        border-radius: 4px;
        font-size: .75rem;
        font-weight: 600;
        letter-spacing: .4px;
    }

    .btn.primary.small:hover {
        filter: brightness(1.08);
    }

    @media (max-width: 720px) {
        .nav-menu {
            position: absolute;
            inset: 56px 0 auto 0;
            flex-direction: column;
            align-items: flex-start;
            background: var(--color-bg, #fff);
            padding: .75rem 1rem 1rem;
            border-bottom: 1px solid var(--color-border, #e5e7eb);
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .08);
            display: none;
        }

        .nav-menu[data-open="true"] {
            display: flex;
        }
    }
</style>
<script>
    // Minimal progressive enhancement: toggle nav on small screens
    (function () {
        const toggle = document.currentScript.previousElementSibling.previousElementSibling.querySelector('.nav-toggle');
    })();
</script>
<script>
    (function () {
        const nav = document.querySelector('.navbar');
        if (!nav) return;
        const btn = nav.querySelector('.nav-toggle');
        const menu = nav.querySelector('#nav-menu');
        if (!btn || !menu) return;
        btn.addEventListener('click', () => {
            const open = btn.getAttribute('aria-expanded') === 'true';
            btn.setAttribute('aria-expanded', String(!open));
            menu.dataset.open = String(!open);
        });
    })();
</script>
