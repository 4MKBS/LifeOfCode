<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Draggable Block</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #f0f0f0;
        }

        #draggable {
            width: 100px;
            height: 100px;
            background: #3498db;
            position: absolute;
            top: 100px;
            left: 100px;
            cursor: grab;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.2s;
        }

        #draggable:active {
            cursor: grabbing;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div id="draggable"></div>

    <script>
        const block = document.getElementById('draggable');
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        block.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - block.offsetLeft;
            offsetY = e.clientY - block.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                block.style.left = (e.clientX - offsetX) + 'px';
                block.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>

</html>
