<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .weather-icon {
            font-size: 5rem;
        }
    </style>
</head>

<body class="min-h-screen p-4 flex items-center justify-center">
    <div class="glass rounded-3xl shadow-2xl p-8 max-w-md w-full">
        <h1
            class="text-4xl font-bold text-center bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-6">
            ☁️ Weather App
        </h1>

        <div class="mb-6">
            <input type="text" id="cityInput" placeholder="Enter city name..."
                class="w-full p-4 rounded-xl border-2 focus:border-purple-500 outline-none">
            <button onclick="getWeather()"
                class="w-full mt-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl hover:shadow-lg transition-all">
                🔍 Search Weather
            </button>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-purple-600 mx-auto"></div>
        </div>

        <div id="weatherData" class="hidden">
            <div class="text-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800" id="cityName">-</h2>
                <p class="text-gray-500" id="date">-</p>
            </div>

            <div class="text-center mb-6">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div class="text-6xl font-bold text-purple-600" id="temperature">--°</div>
                <p class="text-xl text-gray-600 capitalize" id="description">-</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-4 rounded-xl text-center">
                    <p class="text-sm text-blue-600">Humidity</p>
                    <p class="text-2xl font-bold text-blue-700" id="humidity">--%</p>
                </div>
                <div class="bg-green-50 p-4 rounded-xl text-center">
                    <p class="text-sm text-green-600">Wind Speed</p>
                    <p class="text-2xl font-bold text-green-700" id="windSpeed">-- km/h</p>
                </div>
                <div class="bg-orange-50 p-4 rounded-xl text-center">
                    <p class="text-sm text-orange-600">Feels Like</p>
                    <p class="text-2xl font-bold text-orange-700" id="feelsLike">--°</p>
                </div>
                <div class="bg-purple-50 p-4 rounded-xl text-center">
                    <p class="text-sm text-purple-600">Pressure</p>
                    <p class="text-2xl font-bold text-purple-700" id="pressure">-- hPa</p>
                </div>
            </div>
        </div>

        <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-lg mt-4">
            <p class="text-red-700">❌ <span id="errorMsg">City not found</span></p>
        </div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return alert('Please enter a city name');

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('weatherData').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');

            try {
                // Using OpenWeather API (you'll need to register for a free API key at openweathermap.org)
                const API_KEY = 'b1fd6e14799699504191b6bdbcadfc35'; // Replace with your API key
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);

                if (!response.ok) throw new Error('City not found');

                const data = await response.json();

                document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
                document.getElementById('date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
                document.getElementById('description').textContent = data.weather[0].description;
                document.getElementById('humidity').textContent = `${data.main.humidity}%`;
                document.getElementById('windSpeed').textContent = `${Math.round(data.wind.speed * 3.6)} km/h`;
                document.getElementById('feelsLike').textContent = `${Math.round(data.main.feels_like)}°C`;
                document.getElementById('pressure').textContent = `${data.main.pressure} hPa`;

                const weatherIcons = {
                    Clear: '☀️', Clouds: '☁️', Rain: '🌧️', Drizzle: '🌦️',
                    Thunderstorm: '⛈️', Snow: '❄️', Mist: '🌫️', Smoke: '🌫️',
                    Haze: '🌫️', Dust: '🌫️', Fog: '🌫️', Sand: '🌫️',
                    Ash: '🌫️', Squall: '💨', Tornado: '🌪️'
                };
                document.getElementById('weatherIcon').textContent = weatherIcons[data.weather[0].main] || '🌤️';

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('weatherData').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
                document.getElementById('errorMsg').textContent = error.message;
            }
        }

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getWeather();
        });
    </script>
</body>

</html>
