<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-900 mb-2">📖 Guestbook</h1>
            <p class="text-gray-600">Leave your message and share your thoughts</p>
        </div>

        <!-- Form Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Sign Our Guestbook</h2>
            <form id="guestbookForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Name *</label>
                    <input type="text" id="name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Email</label>
                    <input type="email" id="email"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Message *</label>
                    <textarea id="message" required rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none resize-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 transform hover:scale-105">
                    Submit Entry
                </button>
            </form>
        </div>

        <!-- Entries Section -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Recent Entries (<span id="entryCount">0</span>)</h2>
            <div id="entries" class="space-y-4"></div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('guestbookEntries')) || [];

        function renderEntries() {
            const entriesContainer = document.getElementById('entries');
            const entryCount = document.getElementById('entryCount');

            entryCount.textContent = entries.length;

            if (entries.length === 0) {
                entriesContainer.innerHTML = '<p class="text-gray-500 text-center py-8">No entries yet. Be the first to sign!</p>';
                return;
            }

            entriesContainer.innerHTML = entries.map((entry, index) => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition duration-200">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-semibold text-lg text-indigo-900">${entry.name}</h3>
                            ${entry.email ? `<p class="text-sm text-gray-500">${entry.email}</p>` : ''}
                        </div>
                        <button onclick="deleteEntry(${index})" 
                            class="text-red-500 hover:text-red-700 text-sm font-medium">
                            Delete
                        </button>
                    </div>
                    <p class="text-gray-700 mb-2">${entry.message}</p>
                    <p class="text-xs text-gray-400">${entry.timestamp}</p>
                </div>
            `).reverse().join('');
        }

        function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this entry?')) {
                entries.splice(entries.length - 1 - index, 1);
                localStorage.setItem('guestbookEntries', JSON.stringify(entries));
                renderEntries();
            }
        }

        document.getElementById('guestbookForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            const entry = {
                name: name,
                email: email,
                message: message,
                timestamp: new Date().toLocaleString()
            };

            entries.push(entry);
            localStorage.setItem('guestbookEntries', JSON.stringify(entries));

            this.reset();
            renderEntries();

            alert('✅ Thank you for signing our guestbook!');
        });

        renderEntries();
    </script>
</body>

</html>
