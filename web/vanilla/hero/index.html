<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hero</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #0b0e1a;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
            font-family: monospace;
            color: #ccc;
            position: relative;
        }

        .name {
            margin-top: 100px;
            padding: 10px;
            font-size: 60px;
            text-align: center;
            position: relative;
            background: linear-gradient(90deg, #b36bff, #d88fff, #84b5ff);
            /* purple → pink → blue */
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowSweep 4s ease-in-out infinite alternate;
        }

        @keyframes glowSweep {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 100% center;
            }
        }

        .typing {
            font-size: 28px;
            text-align: center;
            background: linear-gradient(90deg, green, #14b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: monospace;
            min-height: 40px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid rgba(255, 255, 255, 0.75);
            width: fit-content;
            margin: 0 auto;
            animation: blinkCursor 0.8s steps(1) infinite;
        }

        @keyframes blinkCursor {

            0%,
            100% {
                border-color: rgba(255, 255, 255, 0.75);
            }

            50% {
                border-color: transparent;
            }
        }

        /* Glow elements */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.2), transparent);
            filter: blur(100px);
            z-index: 0;
        }

        .glow.green {
            background: radial-gradient(circle, rgba(0, 255, 128, 0.3), transparent);
            top: 20%;
            left: 75%;
        }

        .glow.purple {
            background: radial-gradient(circle, rgba(128, 0, 255, 0.3), transparent);
            top: 35%;
            left: 10%;
        }

        /* Code snippet bounce animation */
        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .code-snippet {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1rem;
            white-space: nowrap;
            animation: bounce 3s ease-in-out infinite;
        }

        /* Dot flicker animation */
        @keyframes flicker {

            0%,
            100% {
                opacity: 0;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: flicker 2s infinite;
        }
    </style>
</head>

<body>

    <!-- Glows -->
    <div class="glow purple"></div>
    <div class="glow green"></div>

    <!-- Code snippets -->
    <div class="code-snippet" style="top: 200px; left: 200px;">&lt;div&gt;</div>
    <div class="code-snippet" style="top: 300px; left: 600px;">&lt;props&gt;</div>
    <div class="code-snippet" style="top: 150px; left: 800px;">&lt;function&gt;</div>
    <div class="code-snippet" style="top: 400px; left: 1000px;">&lt;/div&gt;</div>
    <h1 class="name">Khairul Bashar
    </h1>
    <h2 class="typing" id="typing"></h2>

    <!-- Random dots -->
    <script>
        for (let i = 0; i < 60; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.top = `${Math.random() * 100}%`;
            dot.style.left = `${Math.random() * 100}%`;
            // Random animation delay for each dot (for natural flicker)
            dot.style.animationDelay = `${Math.random() * 5}s`;
            dot.style.animationDuration = `${1 + Math.random() * 2}s`;
            document.body.appendChild(dot);
        }
        const texts = ["Fullstack Developer", "Software Engineer", "Problem Solver"];
        const typingElement = document.getElementById("typing");
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function type() {
            const currentText = texts[textIndex];
            const displayedText = currentText.substring(0, charIndex);
            typingElement.textContent = displayedText;
            if (!isDeleting && charIndex < currentText.length) {
                charIndex++;
                setTimeout(type, 100);
            } else if (isDeleting && charIndex > 0) {
                charIndex--;
                setTimeout(type, 50);
            } else {
                isDeleting = !isDeleting;
                if (!isDeleting) {
                    textIndex = (textIndex + 1) % texts.length;
                }
                setTimeout(type, 1000);
            }
        }
        type();
    </script>
</body>

</html>
