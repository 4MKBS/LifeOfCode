<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .recipe-card {
            transition: all 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-5xl font-bold text-center text-white mb-8">👨‍🍳 Recipe Manager</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Add Recipe Form -->
            <div class="glass rounded-2xl p-6 shadow-xl h-fit sticky top-4">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">➕ Add Recipe</h2>
                <form id="recipeForm" class="space-y-4">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Recipe Name</label>
                        <input type="text" id="recipeName" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="e.g., Spaghetti Carbonara">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Category</label>
                        <select id="category"
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none">
                            <option value="breakfast">🍳 Breakfast</option>
                            <option value="lunch">🍱 Lunch</option>
                            <option value="dinner">🍽️ Dinner</option>
                            <option value="dessert">🍰 Dessert</option>
                            <option value="snacks">🍿 Snacks</option>
                            <option value="drinks">🥤 Drinks</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Cooking Time (mins)</label>
                        <input type="number" id="cookTime" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="30">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Difficulty</label>
                        <select id="difficulty"
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none">
                            <option value="easy">😊 Easy</option>
                            <option value="medium">😐 Medium</option>
                            <option value="hard">😰 Hard</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Ingredients</label>
                        <textarea id="ingredients" rows="3" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="One per line..."></textarea>
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Instructions</label>
                        <textarea id="instructions" rows="4" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="Step by step..."></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition-all">
                        ✨ Add Recipe
                    </button>
                </form>
            </div>

            <!-- Recipes List -->
            <div class="lg:col-span-2">
                <!-- Filter -->
                <div class="glass rounded-2xl p-4 mb-6 shadow-xl">
                    <div class="flex flex-wrap gap-3 items-center">
                        <span class="font-semibold text-gray-700">Filter:</span>
                        <button onclick="filterRecipes('all')"
                            class="filter-btn px-4 py-2 rounded-full bg-purple-600 text-white">All</button>
                        <button onclick="filterRecipes('breakfast')"
                            class="filter-btn px-4 py-2 rounded-full bg-gray-200">🍳 Breakfast</button>
                        <button onclick="filterRecipes('lunch')"
                            class="filter-btn px-4 py-2 rounded-full bg-gray-200">🍱 Lunch</button>
                        <button onclick="filterRecipes('dinner')"
                            class="filter-btn px-4 py-2 rounded-full bg-gray-200">🍽️ Dinner</button>
                        <button onclick="filterRecipes('dessert')"
                            class="filter-btn px-4 py-2 rounded-full bg-gray-200">🍰 Dessert</button>
                    </div>
                </div>

                <!-- Recipes Grid -->
                <div id="recipesList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <p class="col-span-full glass rounded-2xl p-12 text-center text-gray-400">No recipes yet. Add your
                        first recipe!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Recipe Detail Modal -->
    <div id="recipeModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="glass rounded-2xl p-8 max-w-2xl w-full max-h-screen overflow-y-auto">
            <div class="flex justify-between items-start mb-6">
                <h2 class="text-3xl font-bold text-gray-800" id="modalTitle">Recipe Name</h2>
                <button onclick="closeModal()" class="text-4xl text-gray-500 hover:text-gray-700">×</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        let recipes = JSON.parse(localStorage.getItem('recipes')) || [];
        let currentFilter = 'all';

        const categoryEmojis = {
            breakfast: '🍳', lunch: '🍱', dinner: '🍽️',
            dessert: '🍰', snacks: '🍿', drinks: '🥤'
        };

        const difficultyColors = {
            easy: 'bg-green-100 text-green-700',
            medium: 'bg-yellow-100 text-yellow-700',
            hard: 'bg-red-100 text-red-700'
        };

        document.getElementById('recipeForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const recipe = {
                id: Date.now(),
                name: document.getElementById('recipeName').value,
                category: document.getElementById('category').value,
                cookTime: document.getElementById('cookTime').value,
                difficulty: document.getElementById('difficulty').value,
                ingredients: document.getElementById('ingredients').value.split('\n').filter(i => i.trim()),
                instructions: document.getElementById('instructions').value,
                created: new Date().toLocaleDateString()
            };

            recipes.unshift(recipe);
            localStorage.setItem('recipes', JSON.stringify(recipes));
            e.target.reset();
            displayRecipes();
        });

        function filterRecipes(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-4 py-2 rounded-full bg-gray-200';
            });
            event.target.className = 'filter-btn px-4 py-2 rounded-full bg-purple-600 text-white';
            displayRecipes();
        }

        function displayRecipes() {
            const filtered = currentFilter === 'all'
                ? recipes
                : recipes.filter(r => r.category === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('recipesList').innerHTML = '<p class="col-span-full glass rounded-2xl p-12 text-center text-gray-400">No recipes in this category</p>';
                return;
            }

            document.getElementById('recipesList').innerHTML = filtered.map(r => `
                <div class="recipe-card glass rounded-2xl p-6 shadow-xl cursor-pointer" onclick="viewRecipe(${r.id})">
                    <div class="flex items-start justify-between mb-4">
                        <div class="text-5xl">${categoryEmojis[r.category]}</div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${difficultyColors[r.difficulty]}">
                            ${r.difficulty.toUpperCase()}
                        </span>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">${r.name}</h3>
                    <div class="flex items-center gap-4 text-sm text-gray-600 mb-4">
                        <span>⏱️ ${r.cookTime} mins</span>
                        <span>📝 ${r.ingredients.length} ingredients</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="event.stopPropagation(); viewRecipe(${r.id})" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-lg transition-all">
                            👁️ View
                        </button>
                        <button onclick="event.stopPropagation(); deleteRecipe(${r.id})" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-all">
                            🗑️
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function viewRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            document.getElementById('modalTitle').textContent = recipe.name;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center p-4 bg-purple-50 rounded-lg">
                            <p class="text-sm text-gray-600">Category</p>
                            <p class="text-2xl">${categoryEmojis[recipe.category]}</p>
                        </div>
                        <div class="text-center p-4 bg-blue-50 rounded-lg">
                            <p class="text-sm text-gray-600">Time</p>
                            <p class="text-xl font-bold text-blue-700">${recipe.cookTime}m</p>
                        </div>
                        <div class="text-center p-4 rounded-lg ${difficultyColors[recipe.difficulty]}">
                            <p class="text-sm">Difficulty</p>
                            <p class="font-bold">${recipe.difficulty}</p>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-3">🛒 Ingredients:</h3>
                        <ul class="list-disc list-inside space-y-1 text-gray-700">
                            ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-3">👨‍🍳 Instructions:</h3>
                        <p class="text-gray-700 whitespace-pre-line">${recipe.instructions}</p>
                    </div>
                </div>
            `;
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
        }

        function deleteRecipe(id) {
            if (confirm('Delete this recipe?')) {
                recipes = recipes.filter(r => r.id !== id);
                localStorage.setItem('recipes', JSON.stringify(recipes));
                displayRecipes();
            }
        }

        displayRecipes();
    </script>
</body>

</html>
