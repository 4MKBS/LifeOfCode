<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-red-500 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        <div class="bg-gradient-to-r from-purple-600 to-pink-600 p-6 text-center">
            <h1 class="text-3xl font-bold text-white">🎂 Age Calculator</h1>
            <p class="text-purple-100 mt-2">Discover your exact age</p>
        </div>

        <div class="p-8">
            <div class="mb-6">
                <label for="birthdate" class="block text-gray-700 font-semibold mb-3 text-lg">
                    📅 Your Birth Date
                </label>
                <input type="date" id="birthdate"
                    class="w-full px-4 py-3 border-2 border-purple-200 rounded-xl focus:outline-none focus:border-purple-500 transition-colors">
            </div>

            <button onclick="calculateAge()"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl hover:from-purple-700 hover:to-pink-700 transform hover:scale-105 transition-all duration-200 shadow-lg">
                Calculate My Age ✨
            </button>

            <div id="result" class="mt-6 space-y-4 hidden">
                <div class="bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl p-6 border-2 border-purple-200">
                    <h2 class="text-2xl font-bold text-purple-700 mb-4 text-center">Your Age</h2>
                    <div id="ageDetails" class="text-center text-gray-700 text-lg"></div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-blue-50 rounded-xl p-4 text-center border border-blue-200">
                        <p class="text-xs text-gray-600 mb-1">Total Days</p>
                        <p id="totalDays" class="text-xl font-bold text-blue-600">0</p>
                    </div>
                    <div class="bg-green-50 rounded-xl p-4 text-center border border-green-200">
                        <p class="text-xs text-gray-600 mb-1">Total Months</p>
                        <p id="totalMonths" class="text-xl font-bold text-green-600">0</p>
                    </div>
                    <div class="bg-orange-50 rounded-xl p-4 text-center border border-orange-200">
                        <p class="text-xs text-gray-600 mb-1">Total Hours</p>
                        <p id="totalHours" class="text-xl font-bold text-orange-600">0</p>
                    </div>
                </div>

                <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl p-6 border-2 border-yellow-200">
                    <h3 class="text-xl font-bold text-orange-700 mb-3 text-center">🎉 Next Birthday</h3>
                    <div id="nextBirthday" class="text-center text-gray-700"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateAge() {
            const birthdate = document.getElementById('birthdate').value;

            if (!birthdate) {
                alert('Please select your birth date');
                return;
            }

            const birthDate = new Date(birthdate);
            const today = new Date();

            if (birthDate > today) {
                alert('Birth date cannot be in the future!');
                return;
            }

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
            const totalMonths = years * 12 + months;
            const totalHours = totalDays * 24;

            // Calculate next birthday
            let nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (nextBirthday < today) {
                nextBirthday.setFullYear(today.getFullYear() + 1);
            }
            const daysUntilBirthday = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));
            const monthsUntilBirthday = Math.floor(daysUntilBirthday / 30);
            const remainingDays = daysUntilBirthday % 30;

            document.getElementById('ageDetails').innerHTML = `
                <p class="text-4xl font-bold text-purple-600 mb-2">${years}</p>
                <p class="text-gray-600">Years, <span class="font-semibold">${months}</span> Months, <span class="font-semibold">${days}</span> Days</p>
            `;

            document.getElementById('totalDays').textContent = totalDays.toLocaleString();
            document.getElementById('totalMonths').textContent = totalMonths.toLocaleString();
            document.getElementById('totalHours').textContent = totalHours.toLocaleString();

            document.getElementById('nextBirthday').innerHTML = `
                <p class="text-lg font-semibold text-orange-600 mb-2">
                    ${daysUntilBirthday === 0 ? "🎊 Today is your birthday!" :
                    `${daysUntilBirthday} days to go!`}
                </p>
                ${daysUntilBirthday > 0 ? `
                    <p class="text-sm text-gray-600">
                        (${monthsUntilBirthday} months and ${remainingDays} days)
                    </p>
                    <p class="text-sm text-gray-500 mt-2">
                        📅 ${nextBirthday.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                    </p>
                ` : ''}
            `;

            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>

</html>
