<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Settings — LifeOfCode</title>
    <!-- Tailwind Play CDN for quick prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* small customizations to better match the screenshot */
        .glass-border {
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800 font-sans">
    <div class="flex">
        <!-- Left sidebar -->
        <aside class="w-20 bg-white h-screen shadow-sm hidden md:flex flex-col items-center py-6">
            <div
                class="w-11 h-11 rounded-lg bg-gradient-to-br from-sky-300 to-indigo-200 flex items-center justify-center mb-6">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22 10.9V4.1C22 2.6 21.36 2 19.77 2H15.73C14.14 2 13.5 2.6 13.5 4.1V10.9C13.5 12.4 14.14 13 15.73 13H19.77C21.36 13 22 12.4 22 10.9Z"
                        fill="#4182F9" />
                    <path
                        d="M22 19.9V18.1C22 16.6 21.36 16 19.77 16H15.73C14.14 16 13.5 16.6 13.5 18.1V19.9C13.5 21.4 14.14 22 15.73 22H19.77C21.36 22 22 21.4 22 19.9Z"
                        fill="#4182F9" />
                    <path
                        d="M10.5 13.1V19.9C10.5 21.4 9.86 22 8.27 22H4.23C2.64 22 2 21.4 2 19.9V13.1C2 11.6 2.64 11 4.23 11H8.27C9.86 11 10.5 11.6 10.5 13.1Z"
                        fill="#4182F9" />
                    <path
                        d="M10.5 4.1V5.9C10.5 7.4 9.86 8 8.27 8H4.23C2.64 8 2 7.4 2 5.9V4.1C2 2.6 2.64 2 4.23 2H8.27C9.86 2 10.5 2.6 10.5 4.1Z"
                        fill="#4182F9" />
                </svg>

            </div>
            <nav class="space-y-4 mt-4">
                <!-- Logo (active) -->
                <button aria-label="Dashboard"
                    class="w-10 h-10 rounded-lg bg-transparent hover:bg-gray-100 flex items-center justify-center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g opacity="0.2">
                            <path
                                d="M18.32 12C20.92 12 22 11 21.04 7.72C20.39 5.51 18.49 3.61 16.28 2.96C13 2 12 3.08 12 5.68V8.56C12 11 13 12 15 12H18.32Z"
                                stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path
                                d="M19.9999 14.7C19.0699 19.33 14.6299 22.69 9.57993 21.87C5.78993 21.26 2.73993 18.21 2.11993 14.42C1.30993 9.38999 4.64993 4.94999 9.25993 4.00999"
                                stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </svg>

                </button>

                <!-- Award / badge -->
                <button aria-label="Achievements"
                    class="w-10 h-10 rounded-lg bg-transparent hover:bg-gray-100 flex items-center justify-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
                        aria-hidden="true">
                        <path d="M12 2a7 7 0 100 14 7 7 0 000-14zM7 20l2.5-3 2.5 3 2.5-3L17 20l-5 2-5-2z" />
                    </svg>
                </button>

                <!-- Chat -->
                <button aria-label="Messages"
                    class="w-10 h-10 rounded-lg bg-transparent hover:bg-gray-100 flex items-center justify-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
                        aria-hidden="true">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
                    </svg>
                </button>

                <!-- Settings -->
                <button aria-label="Settings"
                    class="w-10 h-10 rounded-lg bg-transparent hover:bg-gray-100 flex items-center justify-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"
                        aria-hidden="true">
                        <path
                            d="M12 8a4 4 0 100 8 4 4 0 000-8zm9.4 3a7.9 7.9 0 01-.1 1l2.1 1.6-2 3.5-2.5-.9a8 8 0 01-1.7 1l-.4 2.6H9.2l-.4-2.6a8 8 0 01-1.7-1L4.6 17 2.6 13.5 4.7 11.9a7.9 7.9 0 010-2L2.6 8.3 4.6 4.8l2.5.9c.5-.4 1.1-.8 1.7-1L9.2 1h5.6l.4 2.6c.6.2 1.2.6 1.7 1l2.5-.9 2 3.5-2.1 1.6c.1.3.2.7.2 1z" />
                    </svg>
                </button>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1">
            <!-- Top header -->
            <header class="py-6 px-8 flex items-center justify-between bg-white shadow-sm">
                <div>
                    <h1 class="text-2xl font-semibold">Welcome, Amanda</h1>
                    <p class="text-sm text-slate-400">Tue, 07 June 2022</p>
                </div>

                <div class="flex items-center gap-4">
                    <div class="relative">
                        <input type="search" placeholder="Search"
                            class="w-64 pl-4 pr-10 py-2 rounded-lg bg-gray-100 text-sm outline-none" />
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute right-3 top-2.5 h-5 w-5 text-slate-400"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-4.35-4.35M11 19a8 8 0 110-16 8 8 0 010 16z" />
                        </svg>
                    </div>
                    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="52" height="52" rx="10" fill="white" />
                        <path d="M26 20.44V23.77" stroke="#ADA7A7" stroke-width="1.5" stroke-miterlimit="10"
                            stroke-linecap="round" />
                        <path
                            d="M26.0199 16C22.3399 16 19.3599 18.98 19.3599 22.66V24.76C19.3599 25.44 19.0799 26.46 18.7299 27.04L17.4599 29.16C16.6799 30.47 17.2199 31.93 18.6599 32.41C23.4399 34 28.6099 34 33.3899 32.41C34.7399 31.96 35.3199 30.38 34.5899 29.16L33.3199 27.04C32.9699 26.46 32.6899 25.43 32.6899 24.76V22.66C32.6799 19 29.6799 16 26.0199 16Z"
                            stroke="#ADA7A7" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" />
                        <path
                            d="M29.3299 32.82C29.3299 34.65 27.8299 36.15 25.9999 36.15C25.0899 36.15 24.2499 35.77 23.6499 35.17C23.0499 34.57 22.6699 33.73 22.6699 32.82"
                            stroke="#ADA7A7" stroke-width="1.5" stroke-miterlimit="10" />
                    </svg>
                    <button class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center">
                        <img src="https://i.pravatar.cc/40?img=32" alt="avatar" class="w-8 h-8 rounded-full" />
                    </button>
                </div>
            </header>

            <!-- Gradient hero area and profile card -->
            <section class="p-8">
                <div class="bg-gradient-to-r from-sky-200 via-indigo-100 to-amber-100 rounded-lg h-28"></div>

                <div class="mt-6">
                    <div class="bg-white glass-border rounded-lg shadow-sm p-8 -mt-16">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-4">
                                <div class="w-20 h-20 rounded-full bg-gradient-to-br from-indigo-300 to-sky-300 p-1">
                                    <img src="https://i.pravatar.cc/80?img=5" alt="avatar"
                                        class="w-full h-full rounded-full object-cover border-2 border-white" />
                                </div>
                                <div>
                                    <h2 class="text-xl font-semibold">Alexa Rawles</h2>
                                    <p class="text-sm text-slate-400">alexarawles@gmail.com</p>
                                </div>
                            </div>

                            <div>
                                <button class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow">Edit</button>
                            </div>
                        </div>

                        <form class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Full Name</label>
                                    <input class="w-full rounded-md bg-gray-100 py-3 px-4 text-sm outline-none"
                                        placeholder="Your First Name" />
                                </div>

                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Gender</label>
                                    <div class="relative">
                                        <select class="w-full appearance-none rounded-md bg-gray-100 py-3 px-4 text-sm">
                                            <option>-- Select --</option>
                                            <option>Female</option>
                                            <option>Male</option>
                                        </select>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="pointer-events-none absolute right-3 top-3 h-4 w-4 text-slate-400"
                                            viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Language</label>
                                    <div class="relative">
                                        <select class="w-full appearance-none rounded-md bg-gray-100 py-3 px-4 text-sm">
                                            <option>English</option>
                                            <option>Spanish</option>
                                        </select>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="pointer-events-none absolute right-3 top-3 h-4 w-4 text-slate-400"
                                            viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Nick Name</label>
                                    <input class="w-full rounded-md bg-gray-100 py-3 px-4 text-sm outline-none"
                                        placeholder="Your First Name" />
                                </div>

                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Country</label>
                                    <div class="relative">
                                        <select class="w-full appearance-none rounded-md bg-gray-100 py-3 px-4 text-sm">
                                            <option>-- Select --</option>
                                            <option>USA</option>
                                            <option>Canada</option>
                                        </select>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="pointer-events-none absolute right-3 top-3 h-4 w-4 text-slate-400"
                                            viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm text-slate-600 mb-2">Time Zone</label>
                                    <div class="relative">
                                        <select class="w-full appearance-none rounded-md bg-gray-100 py-3 px-4 text-sm">
                                            <option>GMT+0</option>
                                            <option>GMT+6</option>
                                        </select>
                                        <svg xmlns="http://www.w3.org/2000/svg"
                                            class="pointer-events-none absolute right-3 top-3 h-4 w-4 text-slate-400"
                                            viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </form>

                        <div class="mt-8">
                            <h3 class="text-sm font-semibold">My email Address</h3>
                            <div class="mt-4 bg-white">
                                <ul class="space-y-4">
                                    <li class="flex items-center gap-3">
                                        <div
                                            class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500"
                                                viewBox="0 0 20 20" fill="currentColor">
                                                <path d="M2.94 6.94A2 2 0 014 6h12a2 2 0 011.06.94L10 11 2.94 6.94z" />
                                                <path d="M18 8.35V14a2 2 0 01-2 2H4a2 2 0 01-2-2V8.35l8 4 8-4z" />
                                            </svg>
                                        </div>
                                        <div>
                                            <div class="text-sm font-medium">alexarawles@gmail.com</div>
                                            <div class="text-xs text-slate-400">1 month ago</div>
                                        </div>
                                    </li>
                                </ul>

                                <div class="mt-6">
                                    <button
                                        class="px-4 py-2 rounded-md bg-white border border-blue-100 text-blue-500">+Add
                                        Email Address</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
