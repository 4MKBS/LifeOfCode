<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .product-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-5xl font-bold text-center text-white mb-8">🛒 Shopping Cart</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Products -->
            <div class="lg:col-span-2">
                <div class="glass rounded-2xl p-6 shadow-2xl">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">🏪 Products</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="products"></div>
                </div>
            </div>

            <!-- Cart -->
            <div class="glass rounded-2xl p-6 shadow-2xl h-fit sticky top-4">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">🛍️ Your Cart</h2>
                <div id="cartItems" class="space-y-3 mb-6 max-h-96 overflow-y-auto">
                    <p class="text-center text-gray-400 py-8">Cart is empty</p>
                </div>
                <div class="border-t pt-4">
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">Subtotal:</span>
                        <span class="font-semibold" id="subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between mb-2">
                        <span class="text-gray-600">Tax (10%):</span>
                        <span class="font-semibold" id="tax">$0.00</span>
                    </div>
                    <div class="flex justify-between text-xl font-bold mb-4">
                        <span>Total:</span>
                        <span class="text-purple-600" id="total">$0.00</span>
                    </div>
                    <button onclick="checkout()"
                        class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 rounded-lg hover:shadow-lg transition-all">
                        💳 Checkout
                    </button>
                    <button onclick="clearCart()"
                        class="w-full mt-2 bg-red-500 hover:bg-red-600 text-white font-bold py-2 rounded-lg transition-all">
                        🗑️ Clear Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Wireless Headphones', price: 79.99, emoji: '🎧', category: 'Electronics' },
            { id: 2, name: 'Smart Watch', price: 199.99, emoji: '⌚', category: 'Electronics' },
            { id: 3, name: 'Laptop', price: 999.99, emoji: '💻', category: 'Electronics' },
            { id: 4, name: 'Camera', price: 599.99, emoji: '📷', category: 'Electronics' },
            { id: 5, name: 'Running Shoes', price: 89.99, emoji: '👟', category: 'Fashion' },
            { id: 6, name: 'Backpack', price: 49.99, emoji: '🎒', category: 'Fashion' },
            { id: 7, name: 'Coffee Maker', price: 129.99, emoji: '☕', category: 'Home' },
            { id: 8, name: 'Desk Lamp', price: 39.99, emoji: '💡', category: 'Home' }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function displayProducts() {
            document.getElementById('products').innerHTML = products.map(p => `
                <div class="product-card bg-white p-4 rounded-xl shadow-lg transition-all cursor-pointer border-2 border-transparent hover:border-purple-500">
                    <div class="text-6xl text-center mb-3">${p.emoji}</div>
                    <h3 class="font-bold text-gray-800 mb-1">${p.name}</h3>
                    <p class="text-sm text-gray-500 mb-2">${p.category}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-bold text-purple-600">$${p.price}</span>
                        <button onclick="addToCart(${p.id})" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-all">
                            + Add
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            displayCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            displayCart();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    saveCart();
                    displayCart();
                }
            }
        }

        function displayCart() {
            if (cart.length === 0) {
                document.getElementById('cartItems').innerHTML = '<p class="text-center text-gray-400 py-8">Cart is empty</p>';
                updateTotals();
                return;
            }

            document.getElementById('cartItems').innerHTML = cart.map(item => `
                <div class="bg-gray-50 p-3 rounded-lg">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center">
                            <span class="text-3xl mr-3">${item.emoji}</span>
                            <div>
                                <h4 class="font-semibold text-gray-800">${item.name}</h4>
                                <p class="text-sm text-gray-500">$${item.price}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700">
                            🗑️
                        </button>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <button onclick="updateQuantity(${item.id}, -1)" class="bg-gray-300 hover:bg-gray-400 w-8 h-8 rounded-full">−</button>
                            <span class="font-bold">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="bg-purple-600 hover:bg-purple-700 text-white w-8 h-8 rounded-full">+</button>
                        </div>
                        <span class="font-bold text-purple-600">$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                </div>
            `).join('');

            updateTotals();
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1;
            const total = subtotal + tax;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function clearCart() {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                saveCart();
                displayCart();
            }
        }

        function checkout() {
            if (cart.length === 0) return alert('Cart is empty!');
            const total = document.getElementById('total').textContent;
            alert(`✅ Order placed successfully!\nTotal: ${total}\n\nThank you for shopping with us!`);
            cart = [];
            saveCart();
            displayCart();
        }

        displayProducts();
        displayCart();
    </script>
</body>

</html>
