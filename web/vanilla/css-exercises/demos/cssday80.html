<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-only Music Visualizer</title>
    <style>
      :root {
        --bg1: #070816;
        --bg2: #111833;
        --accent: #7c5cff;
        --accent2: #22d3ee;
        --accent3: #ff4fd8;
        --panel: rgba(255, 255, 255, 0.08);
        --glass: rgba(255, 255, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(124, 92, 255, 0.22),
            transparent 28%
          ),
          radial-gradient(
            circle at 80% 30%,
            rgba(34, 211, 238, 0.18),
            transparent 26%
          ),
          radial-gradient(
            circle at 50% 80%,
            rgba(255, 79, 216, 0.14),
            transparent 22%
          ),
          linear-gradient(160deg, var(--bg2), var(--bg1));
        color: #fff;
      }

      .scene {
        position: relative;
        width: min(92vw, 980px);
        height: min(80vh, 620px);
        border-radius: 32px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .scene::before,
      .scene::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(18px);
        opacity: 0.75;
      }

      .scene::before {
        width: 280px;
        height: 280px;
        left: -80px;
        top: -80px;
        background: radial-gradient(
          circle,
          rgba(124, 92, 255, 0.55),
          transparent 70%
        );
      }

      .scene::after {
        width: 340px;
        height: 340px;
        right: -120px;
        bottom: -120px;
        background: radial-gradient(
          circle,
          rgba(34, 211, 238, 0.35),
          transparent 70%
        );
      }

      .visualizer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .core {
        position: relative;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.22),
          rgba(255, 255, 255, 0.06) 34%,
          rgba(255, 255, 255, 0.03) 55%,
          rgba(255, 255, 255, 0.02) 100%
        );
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.12),
          0 0 40px rgba(124, 92, 255, 0.18), 0 0 90px rgba(34, 211, 238, 0.1);
      }

      .core::before,
      .core::after {
        content: "";
        position: absolute;
        inset: -28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .core::after {
        inset: -54px;
        animation-delay: -1.2s;
      }

      .disc {
        position: relative;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(
            circle at 50% 50%,
            #101629 0 14px,
            transparent 15px
          ),
          conic-gradient(
            from 0deg,
            var(--accent),
            var(--accent2),
            var(--accent3),
            var(--accent),
            var(--accent2)
          );
        box-shadow: inset 0 0 0 10px rgba(255, 255, 255, 0.06),
          0 0 30px rgba(0, 0, 0, 0.25);
        animation: spin 4s linear infinite;
      }

      .disc::before {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        background: radial-gradient(
            circle at 50% 50%,
            rgba(255, 255, 255, 0.8) 0 2px,
            transparent 3px
          ),
          radial-gradient(
            circle,
            rgba(255, 255, 255, 0.18),
            rgba(255, 255, 255, 0.03) 70%
          );
        box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.08);
      }

      .bars {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: end;
        gap: 10px;
        width: min(78vw, 720px);
        height: 320px;
        padding: 0 18px;
        justify-content: center;
        pointer-events: none;
        opacity: 0.98;
      }

      .bar {
        width: 22px;
        height: 100%;
        border-radius: 999px;
        display: flex;
        align-items: end;
        justify-content: center;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.03)
        );
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
        transform-origin: bottom;
      }

      .bar > span {
        width: 100%;
        height: 30%;
        border-radius: inherit;
        background: linear-gradient(
          180deg,
          #fdf2ff 0%,
          var(--accent3) 22%,
          var(--accent) 55%,
          var(--accent2) 100%
        );
        box-shadow: 0 0 14px rgba(124, 92, 255, 0.55),
          0 0 20px rgba(34, 211, 238, 0.22);
        animation: bounce 1.25s ease-in-out infinite;
        transform-origin: bottom;
      }

      .bar:nth-child(1) > span {
        animation-delay: -0.05s;
        height: 18%;
      }
      .bar:nth-child(2) > span {
        animation-delay: -0.7s;
        height: 42%;
      }
      .bar:nth-child(3) > span {
        animation-delay: -0.35s;
        height: 64%;
      }
      .bar:nth-child(4) > span {
        animation-delay: -0.95s;
        height: 30%;
      }
      .bar:nth-child(5) > span {
        animation-delay: -0.2s;
        height: 78%;
      }
      .bar:nth-child(6) > span {
        animation-delay: -0.8s;
        height: 52%;
      }
      .bar:nth-child(7) > span {
        animation-delay: -0.45s;
        height: 88%;
      }
      .bar:nth-child(8) > span {
        animation-delay: -0.62s;
        height: 38%;
      }
      .bar:nth-child(9) > span {
        animation-delay: -1.02s;
        height: 68%;
      }
      .bar:nth-child(10) > span {
        animation-delay: -0.18s;
        height: 26%;
      }
      .bar:nth-child(11) > span {
        animation-delay: -0.74s;
        height: 82%;
      }
      .bar:nth-child(12) > span {
        animation-delay: -0.52s;
        height: 44%;
      }
      .bar:nth-child(13) > span {
        animation-delay: -0.88s;
        height: 72%;
      }
      .bar:nth-child(14) > span {
        animation-delay: -0.28s;
        height: 34%;
      }
      .bar:nth-child(15) > span {
        animation-delay: -0.98s;
        height: 60%;
      }

      .title {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        text-align: center;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.74);
        text-shadow: 0 0 18px rgba(124, 92, 255, 0.25);
      }

      .title strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(1.1rem, 2vw, 1.7rem);
        letter-spacing: 0.18em;
        color: #fff;
      }

      .grid {
        position: absolute;
        inset: 0;
        background: linear-gradient(
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(
          180deg,
          transparent,
          rgba(0, 0, 0, 0.9) 20%,
          rgba(0, 0, 0, 0.9) 80%,
          transparent
        );
        opacity: 0.35;
        pointer-events: none;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: scaleY(0.22);
          filter: saturate(0.9);
        }
        20% {
          transform: scaleY(0.75);
        }
        40% {
          transform: scaleY(0.35);
        }
        60% {
          transform: scaleY(0.95);
        }
        80% {
          transform: scaleY(0.5);
          filter: saturate(1.4);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.88);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.18;
        }
        100% {
          transform: scale(0.88);
          opacity: 0.55;
        }
      }

      @media (max-width: 700px) {
        .scene {
          border-radius: 22px;
        }

        .bars {
          gap: 7px;
          height: 250px;
        }

        .bar {
          width: 14px;
        }

        .core {
          width: 180px;
          height: 180px;
        }

        .disc {
          width: 112px;
          height: 112px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .disc,
        .bar > span,
        .core::before,
        .core::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene" aria-label="CSS-only music visualizer">
      <div class="grid"></div>

      <div class="visualizer">
        <div class="bars" aria-hidden="true">
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
          <div class="bar"><span></span></div>
        </div>

        <div class="core" aria-hidden="true">
          <div class="disc"></div>
        </div>
      </div>

      <div class="title">
        Now Playing
        <strong>Visual Echo</strong>
      </div>
    </main>
  </body>
</html>
