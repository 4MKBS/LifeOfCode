<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-Based Color Generator 🎨</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: background 0.8s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .mood-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        .mood-btn {
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .mood-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .mood-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .mood-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .mood-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .calm { background: linear-gradient(135deg, #a8edea, #fed6e3); color: #2d5a5a; }
        .happy { background: linear-gradient(135deg, #f6d365, #fda085); color: #5a3d2d; }
        .angry { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }
        .focused { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }

        .palette-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        .palette-title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .palette {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .color-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .color-card:hover {
            transform: translateY(-5px);
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: background 0.5s ease;
        }

        .color-hex {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .color-rgb {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            transform: scale(1.1);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 500;
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .generating {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <h1>🎨 Mood Color Generator</h1>
    <p class="subtitle">Select your mood and get a matching palette</p>

    <div class="mood-buttons">
        <button class="mood-btn calm" data-mood="calm">😌 Calm</button>
        <button class="mood-btn happy" data-mood="happy">😊 Happy</button>
        <button class="mood-btn angry" data-mood="angry">😤 Angry</button>
        <button class="mood-btn focused" data-mood="focused">🎯 Focused</button>
    </div>

    <div class="palette-container">
        <h2 class="palette-title">Your Palette</h2>
        <div class="palette" id="palette">
            <!-- Colors will be generated here -->
        </div>
    </div>

    <div class="toast" id="toast">Color copied!</div>

    <script>
        const moodColors = {
            calm: {
                primary: ['#a8edea', '#b8d4e3', '#c5dfe8', '#d4e5ed', '#e3eff5'],
                secondary: ['#fed6e3', '#fce4ec', '#f8bbd9', '#f3e5f5', '#e1bee7'],
                gradient: ['#a8edea', '#fed6e3']
            },
            happy: {
                primary: ['#f6d365', '#ffd54f', '#ffca28', '#ffb300', '#ffa000'],
                secondary: ['#fda085', '#ff8a65', '#ff7043', '#ff5722', '#f4511e'],
                gradient: ['#f6d365', '#fda085']
            },
            angry: {
                primary: ['#ff416c', '#e91e63', '#c2185b', '#ad1457', '#880e4f'],
                secondary: ['#ff4b2b', '#ff5722', '#f44336', '#e53935', '#d32f2f'],
                gradient: ['#ff416c', '#ff4b2b']
            },
            focused: {
                primary: ['#667eea', '#5c6bc0', '#512da8', '#4527a0', '#311b92'],
                secondary: ['#764ba2', '#7b1fa2', '#6a1b9a', '#4a148c', '#38006b'],
                gradient: ['#667eea', '#764ba2']
            }
        };

        function generatePalette(mood) {
            const colors = moodColors[mood];
            const palette = [];

            // Mix colors from primary and secondary
            for (let i = 0; i < 5; i++) {
                if (i % 2 === 0) {
                    palette.push(colors.primary[Math.floor(Math.random() * colors.primary.length)]);
                } else {
                    palette.push(colors.secondary[Math.floor(Math.random() * colors.secondary.length)]);
                }
            }

            return { palette, gradient: colors.gradient };
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function renderPalette(colors) {
            const paletteEl = document.getElementById('palette');
            paletteEl.innerHTML = '';
            paletteEl.classList.add('generating');

            colors.forEach((color, index) => {
                const rgb = hexToRgb(color);
                const card = document.createElement('div');
                card.className = 'color-card';
                card.innerHTML = `
                    <div class="color-swatch" style="background: ${color}"></div>
                    <div class="color-hex">${color.toUpperCase()}</div>
                    <div class="color-rgb">rgb(${rgb.r}, ${rgb.g}, ${rgb.b})</div>
                    <button class="copy-btn" data-color="${color}">Copy HEX</button>
                `;
                card.style.animationDelay = `${index * 0.1}s`;
                paletteEl.appendChild(card);
            });

            setTimeout(() => paletteEl.classList.remove('generating'), 500);
        }

        function updateBackground(gradient) {
            document.documentElement.style.setProperty('--primary', gradient[0]);
            document.documentElement.style.setProperty('--secondary', gradient[1]);
            document.body.style.background = `linear-gradient(135deg, ${gradient[0]}, ${gradient[1]})`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`);
            });
        }

        // Event Listeners
        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const mood = btn.dataset.mood;
                const { palette, gradient } = generatePalette(mood);
                renderPalette(palette);
                updateBackground(gradient);
            });
        });

        document.getElementById('palette').addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-btn')) {
                copyToClipboard(e.target.dataset.color);
            }
        });

        // Initial palette
        const { palette, gradient } = generatePalette('focused');
        renderPalette(palette);
    </script>
</body>
</html>
