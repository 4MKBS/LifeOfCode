<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Glitch Effect</title>
    <style>
      :root {
        --bg: #0b1020;
        --text: #f5f7ff;
        --cyan: #00e5ff;
        --pink: #ff3d81;
        --yellow: #ffd166;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at center,
          #1a2450 0%,
          var(--bg) 55%,
          #05070f 100%
        );
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .glitch {
        position: relative;
        font-size: clamp(3rem, 10vw, 8rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.2);
        animation: shift 2.5s infinite linear alternate;
      }

      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        overflow: hidden;
        clip-path: inset(0 0 0 0);
      }

      .glitch::before {
        left: 2px;
        text-shadow: -2px 0 var(--cyan);
        animation: glitchTop 1.8s infinite linear alternate-reverse;
      }

      .glitch::after {
        left: -2px;
        text-shadow: 2px 0 var(--pink);
        animation: glitchBottom 1.4s infinite linear alternate-reverse;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03) 0px,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 2px,
          transparent 5px
        );
        mix-blend-mode: screen;
        opacity: 0.25;
      }

      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
            90deg,
            rgba(0, 229, 255, 0.06),
            transparent 35%,
            rgba(255, 61, 129, 0.06)
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.02) 0 2px,
            transparent 2px 4px
          );
        opacity: 0.18;
        animation: noiseMove 0.35s steps(2) infinite;
      }

      @keyframes shift {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-1px, 1px);
        }
        40% {
          transform: translate(1px, -1px);
        }
        60% {
          transform: translate(-2px, 0);
        }
        80% {
          transform: translate(2px, 1px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      @keyframes glitchTop {
        0% {
          clip-path: inset(0 0 92% 0);
          transform: translate(0, -1px);
        }
        10% {
          clip-path: inset(10% 0 70% 0);
          transform: translate(-2px, 0);
        }
        20% {
          clip-path: inset(20% 0 55% 0);
          transform: translate(2px, 1px);
        }
        30% {
          clip-path: inset(5% 0 80% 0);
          transform: translate(-1px, -1px);
        }
        40% {
          clip-path: inset(30% 0 45% 0);
          transform: translate(3px, 0);
        }
        50% {
          clip-path: inset(0 0 90% 0);
          transform: translate(-3px, 1px);
        }
        60% {
          clip-path: inset(18% 0 60% 0);
          transform: translate(2px, -1px);
        }
        70% {
          clip-path: inset(40% 0 30% 0);
          transform: translate(-2px, 0);
        }
        80% {
          clip-path: inset(12% 0 72% 0);
          transform: translate(1px, 1px);
        }
        90% {
          clip-path: inset(25% 0 50% 0);
          transform: translate(-1px, 0);
        }
        100% {
          clip-path: inset(0 0 92% 0);
          transform: translate(0, 0);
        }
      }

      @keyframes glitchBottom {
        0% {
          clip-path: inset(85% 0 0 0);
          transform: translate(0, 1px);
        }
        10% {
          clip-path: inset(70% 0 10% 0);
          transform: translate(2px, 0);
        }
        20% {
          clip-path: inset(55% 0 20% 0);
          transform: translate(-2px, -1px);
        }
        30% {
          clip-path: inset(78% 0 5% 0);
          transform: translate(1px, 1px);
        }
        40% {
          clip-path: inset(45% 0 30% 0);
          transform: translate(-3px, 0);
        }
        50% {
          clip-path: inset(90% 0 0 0);
          transform: translate(3px, -1px);
        }
        60% {
          clip-path: inset(60% 0 18% 0);
          transform: translate(-2px, 1px);
        }
        70% {
          clip-path: inset(30% 0 40% 0);
          transform: translate(2px, 0);
        }
        80% {
          clip-path: inset(72% 0 12% 0);
          transform: translate(-1px, -1px);
        }
        90% {
          clip-path: inset(50% 0 25% 0);
          transform: translate(1px, 0);
        }
        100% {
          clip-path: inset(85% 0 0 0);
          transform: translate(0, 0);
        }
      }

      @keyframes noiseMove {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-1%, 1%);
        }
        50% {
          transform: translate(1%, -1%);
        }
        75% {
          transform: translate(-1%, -1%);
        }
        100% {
          transform: translate(0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="glitch" data-text="GLITCH">GLITCH</div>
    <div class="scanlines"></div>
    <div class="noise"></div>
  </body>
</html>
