<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-only Illustration</title>
    <style>
      :root {
        --sky-top: #0f1b3d;
        --sky-bottom: #8b4f9f;
        --sun: #ffd56a;
        --mountain-dark: #24355f;
        --mountain-mid: #2f4a7a;
        --mountain-light: #3d5f92;
        --lake: #2a4f86;
        --shore: #18345f;
        --tree: #17365e;
        --cabin: #5c392f;
        --roof: #8a4332;
        --window: #ffdca8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: radial-gradient(
            circle at 50% 18%,
            rgba(255, 213, 106, 0.18),
            transparent 18%
          ),
          linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      .scene {
        position: relative;
        width: min(92vw, 980px);
        aspect-ratio: 16 / 10;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        background: radial-gradient(
            circle at 50% 22%,
            rgba(255, 255, 255, 0.08),
            transparent 22%
          ),
          linear-gradient(
            to bottom,
            #152452 0%,
            #283d70 44%,
            #4a5f8a 62%,
            #233b68 100%
          );
      }

      .sun {
        position: absolute;
        top: 10%;
        left: 50%;
        width: 120px;
        height: 120px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #fff5c9 0%,
          var(--sun) 45%,
          #ffb84d 100%
        );
        box-shadow: 0 0 0 18px rgba(255, 213, 106, 0.08),
          0 0 0 42px rgba(255, 213, 106, 0.06),
          0 0 90px rgba(255, 213, 106, 0.45);
      }

      .cloud {
        position: absolute;
        width: 180px;
        height: 54px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        filter: blur(0.2px);
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 50%;
      }

      .cloud::before {
        width: 64px;
        height: 64px;
        left: 18px;
        top: -28px;
      }

      .cloud::after {
        width: 84px;
        height: 84px;
        right: 18px;
        top: -42px;
      }

      .cloud.one {
        top: 16%;
        left: 8%;
        transform: scale(0.9);
      }
      .cloud.two {
        top: 22%;
        right: 10%;
        transform: scale(1.1);
      }
      .cloud.three {
        top: 32%;
        left: 20%;
        transform: scale(0.75);
        opacity: 0.8;
      }

      .mountains {
        position: absolute;
        inset: auto 0 18% 0;
        height: 46%;
        background: radial-gradient(
              80px 60px at 15% 100%,
              transparent 60%,
              var(--mountain-dark) 61%
            )
            0 0 / 220px 100% repeat-x,
          radial-gradient(
              120px 80px at 50% 100%,
              transparent 62%,
              var(--mountain-mid) 63%
            )
            0 0 / 360px 100% repeat-x,
          radial-gradient(
              140px 90px at 80% 100%,
              transparent 61%,
              var(--mountain-light) 62%
            )
            0 0 / 420px 100% repeat-x;
        clip-path: polygon(
          0 100%,
          0 58%,
          8% 44%,
          16% 62%,
          25% 30%,
          35% 58%,
          44% 40%,
          54% 70%,
          63% 44%,
          72% 60%,
          80% 34%,
          90% 56%,
          100% 42%,
          100% 100%
        );
        opacity: 0.95;
      }

      .lake {
        position: absolute;
        left: -8%;
        right: -8%;
        bottom: -4%;
        height: 32%;
        background: radial-gradient(
            circle at 50% 0%,
            rgba(255, 255, 255, 0.18),
            transparent 18%
          ),
          linear-gradient(to bottom, #21416f, var(--lake));
        clip-path: polygon(
          0 22%,
          12% 16%,
          24% 21%,
          36% 14%,
          48% 20%,
          60% 12%,
          72% 18%,
          84% 10%,
          100% 17%,
          100% 100%,
          0 100%
        );
      }

      .shore {
        position: absolute;
        left: -6%;
        right: -6%;
        bottom: 18%;
        height: 8%;
        background: linear-gradient(to bottom, #294c7d, var(--shore));
        clip-path: polygon(
          0 55%,
          12% 48%,
          25% 58%,
          39% 44%,
          52% 57%,
          66% 42%,
          79% 55%,
          91% 46%,
          100% 54%,
          100% 100%,
          0 100%
        );
      }

      .cabin {
        position: absolute;
        left: 19%;
        bottom: 19%;
        width: 88px;
        height: 60px;
        background: linear-gradient(to bottom, #7a4b3d, var(--cabin));
        border-radius: 10px 10px 6px 6px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
      }

      .cabin::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 10px;
        width: 104px;
        height: 36px;
        background: linear-gradient(135deg, transparent 49%, var(--roof) 50%)
            left/50% 100% no-repeat,
          linear-gradient(-135deg, transparent 49%, var(--roof) 50%) right/50%
            100% no-repeat;
        transform: translateY(-30px);
        border-radius: 6px;
      }

      .cabin::after {
        content: "";
        position: absolute;
        left: 34px;
        top: 24px;
        width: 20px;
        height: 20px;
        background: var(--window);
        border-radius: 4px;
        box-shadow: -20px 0 0 var(--window), 20px 0 0 var(--window);
      }

      .tree {
        position: absolute;
        bottom: 18%;
        width: 22px;
        height: 90px;
        background: linear-gradient(to bottom, #5f3a2e, #352019);
        border-radius: 12px;
      }

      .tree::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 34px;
        width: 96px;
        height: 96px;
        transform: translateX(-50%);
        background: radial-gradient(
            circle at 50% 34%,
            rgba(34, 64, 108, 0.98) 0 22px,
            transparent 23px
          ),
          radial-gradient(
            circle at 35% 55%,
            rgba(34, 64, 108, 0.98) 0 24px,
            transparent 25px
          ),
          radial-gradient(
            circle at 65% 55%,
            rgba(34, 64, 108, 0.98) 0 24px,
            transparent 25px
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(34, 64, 108, 0.98) 0 30px,
            transparent 31px
          );
        border-radius: 50%;
      }

      .tree.one {
        left: 9%;
        height: 78px;
      }
      .tree.two {
        left: 79%;
        height: 92px;
        transform: scale(1.15);
      }
      .tree.three {
        left: 84%;
        height: 70px;
        bottom: 19%;
        transform: scale(0.92);
      }

      .stars {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 12% 18%,
            #fff 0 1.5px,
            transparent 2px
          ),
          radial-gradient(circle at 24% 10%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 40% 16%, #fff 0 1.4px, transparent 2px),
          radial-gradient(circle at 56% 12%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 68% 22%, #fff 0 1.2px, transparent 2px),
          radial-gradient(circle at 82% 14%, #fff 0 1.5px, transparent 2px),
          radial-gradient(circle at 90% 28%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 18% 28%, #fff 0 1px, transparent 2px),
          radial-gradient(circle at 34% 8%, #fff 0 1.2px, transparent 2px),
          radial-gradient(circle at 74% 8%, #fff 0 1px, transparent 2px);
        opacity: 0.8;
        pointer-events: none;
      }

      .fog {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: 13%;
        height: 22%;
        background: radial-gradient(
            circle at 20% 30%,
            rgba(255, 255, 255, 0.12),
            transparent 35%
          ),
          radial-gradient(
            circle at 50% 45%,
            rgba(255, 255, 255, 0.1),
            transparent 38%
          ),
          radial-gradient(
            circle at 80% 30%,
            rgba(255, 255, 255, 0.12),
            transparent 35%
          );
        filter: blur(12px);
        opacity: 0.7;
      }

      @media (max-width: 700px) {
        .scene {
          border-radius: 20px;
        }

        .sun {
          width: 90px;
          height: 90px;
        }

        .cabin {
          transform: scale(0.85);
          transform-origin: bottom left;
        }

        .tree.one {
          left: 5%;
        }
        .tree.two {
          left: 76%;
        }
        .tree.three {
          left: 83%;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-label="CSS-only mountain sunset illustration">
      <div class="stars"></div>
      <div class="sun"></div>

      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div class="cloud three"></div>

      <div class="mountains"></div>
      <div class="fog"></div>
      <div class="shore"></div>
      <div class="lake"></div>

      <div class="cabin"></div>

      <div class="tree one"></div>
      <div class="tree two"></div>
      <div class="tree three"></div>
    </div>
  </body>
</html>
