<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Colors #000000 to #FFFFFF</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
        color: white;
        min-height: 100vh;
      }
      header {
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        padding: 20px;
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      h1 {
        text-align: center;
        font-size: 1.8rem;
        font-weight: 300;
        letter-spacing: 3px;
        background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 15px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      .info {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-icon {
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .progress-bar {
        width: 200px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #00d2ff, #3a7bd5);
        border-radius: 3px;
        transition: width 0.3s ease;
        width: 0%;
      }
      .color-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
        gap: 0;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      .color-container::-webkit-scrollbar {
        width: 8px;
      }
      .color-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
      }
      .color-container::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #667eea, #764ba2);
        border-radius: 4px;
      }
      .color-box {
        aspect-ratio: 1;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .color-box:hover {
        transform: scale(2);
        z-index: 10;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .color-code {
        background: rgba(0, 0, 0, 0.75);
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.5px;
        opacity: 0;
        transition: opacity 0.2s ease;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .color-box:hover .color-code {
        opacity: 1;
      }
      .copy-feedback {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        background: rgba(0, 0, 0, 0.95);
        color: #4caf50;
        padding: 25px 50px;
        border-radius: 16px;
        font-size: 1.2rem;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid rgba(76, 175, 80, 0.3);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .copy-feedback.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .copy-feedback .color-preview {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        margin: 0 auto 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      #sentinel {
        height: 1px;
        grid-column: 1 / -1;
      }
      .tip {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.05);
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎨 ALL 16.7 MILLION COLORS</h1>
      <div class="controls">
        <div class="info">
          <span class="info-icon">🔢</span>
          <span id="progress">0 / 16,777,216</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="tip">👆 Long press to copy</span>
      </div>
    </header>
    <div class="color-container" id="colorContainer">
      <div id="sentinel"></div>
    </div>
    <div class="copy-feedback" id="copyFeedback">
      <div class="color-preview" id="colorPreview"></div>
      <div id="copyText">Copied!</div>
    </div>

    <script>
      const container = document.getElementById("colorContainer");
      const progressText = document.getElementById("progress");
      const progressFill = document.getElementById("progressFill");
      const copyFeedback = document.getElementById("copyFeedback");
      const colorPreview = document.getElementById("colorPreview");
      const copyText = document.getElementById("copyText");
      const sentinel = document.getElementById("sentinel");

      const CHUNK_SIZE = 1024;
      const TOTAL_COLORS = 16777216;
      let currentIndex = 0;
      let isLoading = false;
      let longPressTimer = null;
      const LONG_PRESS_DURATION = 400;

      function intToHex(num) {
        return "#" + num.toString(16).padStart(6, "0").toUpperCase();
      }

      function getContrastColor(hexColor) {
        const r = parseInt(hexColor.slice(1, 3), 16);
        const g = parseInt(hexColor.slice(3, 5), 16);
        const b = parseInt(hexColor.slice(5, 7), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.5 ? "#000000" : "#FFFFFF";
      }

      function showCopyFeedback(colorCode) {
        colorPreview.style.backgroundColor = colorCode;
        copyText.textContent = "Copied: " + colorCode;
        copyFeedback.classList.add("show");
        setTimeout(() => {
          copyFeedback.classList.remove("show");
        }, 1200);
      }

      function loadChunk() {
        if (isLoading || currentIndex >= TOTAL_COLORS) return;
        isLoading = true;

        requestAnimationFrame(() => {
          const fragment = document.createDocumentFragment();
          const end = Math.min(currentIndex + CHUNK_SIZE, TOTAL_COLORS);

          for (let i = currentIndex; i < end; i++) {
            const colorBox = document.createElement("div");
            colorBox.className = "color-box";
            const hexColor = intToHex(i);
            colorBox.style.backgroundColor = hexColor;
            colorBox.dataset.color = hexColor;

            const textColor = getContrastColor(hexColor);
            colorBox.style.color = textColor;

            const colorCode = document.createElement("span");
            colorCode.className = "color-code";
            colorCode.textContent = hexColor;
            colorBox.appendChild(colorCode);

            fragment.appendChild(colorBox);
          }

          container.insertBefore(fragment, sentinel);
          currentIndex = end;

          const percentage = (currentIndex / TOTAL_COLORS) * 100;
          progressFill.style.width = percentage + "%";
          progressText.textContent = `${currentIndex.toLocaleString()} / 16,777,216`;

          isLoading = false;
        });
      }

      const observer = new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting) {
            loadChunk();
          }
        },
        { root: container, rootMargin: "500px" }
      );

      observer.observe(sentinel);

      function startLongPress(e) {
        const target = e.target.closest(".color-box");
        if (target) {
          longPressTimer = setTimeout(() => {
            navigator.clipboard.writeText(target.dataset.color);
            showCopyFeedback(target.dataset.color);
          }, LONG_PRESS_DURATION);
        }
      }

      function cancelLongPress() {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }

      container.addEventListener("mousedown", startLongPress);
      container.addEventListener("mouseup", cancelLongPress);
      container.addEventListener("mouseleave", cancelLongPress);

      container.addEventListener("touchstart", (e) => {
        startLongPress(e.touches[0]);
      });
      container.addEventListener("touchend", cancelLongPress);
      container.addEventListener("touchcancel", cancelLongPress);

      loadChunk();
    </script>
  </body>
</html>
