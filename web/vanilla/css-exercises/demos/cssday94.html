<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Progress Bars</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --track: #1f2937;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(
          circle at top,
          #1e293b 0%,
          var(--bg) 45%,
          #020617 100%
        );
        color: var(--text);
        padding: 24px;
      }

      .skills-card {
        width: min(760px, 100%);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 24px;
        padding: 32px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .header {
        margin-bottom: 28px;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 2vw + 1rem, 2.4rem);
        letter-spacing: 0.02em;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .skill {
        margin-bottom: 22px;
      }

      .skill-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 10px;
        font-size: 0.98rem;
      }

      .skill-name {
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .skill-value {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .bar {
        width: 100%;
        height: 14px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .bar::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.25),
          rgba(255, 255, 255, 0) 35%,
          rgba(255, 255, 255, 0.08) 70%,
          rgba(255, 255, 255, 0)
        );
        opacity: 0.6;
        pointer-events: none;
      }

      .fill {
        height: 100%;
        width: var(--level);
        border-radius: inherit;
        background: linear-gradient(90deg, var(--start), var(--end));
        position: relative;
        box-shadow: 0 0 18px rgba(59, 130, 246, 0.25);
        animation: grow 1.2s ease both;
      }

      .fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.25),
          rgba(255, 255, 255, 0)
        );
        mix-blend-mode: screen;
        opacity: 0.6;
      }

      @keyframes grow {
        from {
          width: 0;
        }
      }

      .html {
        --level: 92%;
        --start: #f97316;
        --end: #fb7185;
      }
      .css {
        --level: 88%;
        --start: #38bdf8;
        --end: #2563eb;
      }
      .js {
        --level: 76%;
        --start: #facc15;
        --end: #f59e0b;
      }
      .react {
        --level: 68%;
        --start: #22d3ee;
        --end: #0ea5e9;
      }
      .design {
        --level: 84%;
        --start: #a78bfa;
        --end: #ec4899;
      }

      @media (max-width: 600px) {
        .skills-card {
          padding: 22px;
          border-radius: 20px;
        }

        .skill-top {
          font-size: 0.92rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="skills-card">
      <div class="header">
        <h1>Skills Progress Bars</h1>
        <p>Simple visual progress bars for showing proficiency levels.</p>
      </div>

      <section class="skill html">
        <div class="skill-top">
          <span class="skill-name">HTML</span>
          <span class="skill-value">92%</span>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </section>

      <section class="skill css">
        <div class="skill-top">
          <span class="skill-name">CSS</span>
          <span class="skill-value">88%</span>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </section>

      <section class="skill js">
        <div class="skill-top">
          <span class="skill-name">JavaScript</span>
          <span class="skill-value">76%</span>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </section>

      <section class="skill react">
        <div class="skill-top">
          <span class="skill-name">React</span>
          <span class="skill-value">68%</span>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </section>

      <section class="skill design">
        <div class="skill-top">
          <span class="skill-name">UI Design</span>
          <span class="skill-value">84%</span>
        </div>
        <div class="bar">
          <div class="fill"></div>
        </div>
      </section>
    </main>
  </body>
</html>
