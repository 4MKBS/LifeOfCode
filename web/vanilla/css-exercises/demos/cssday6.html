<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted Forest Scene</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(
          to bottom,
          #0a0a12 0%,
          #0d1a1a 50%,
          #0a0f0a 100%
        );
        overflow: hidden;
        font-family: "Georgia", serif;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* Moon */
      .moon {
        position: absolute;
        top: 50px;
        right: 150px;
        width: 80px;
        height: 80px;
        background: radial-gradient(
          circle,
          #c4c4d4 0%,
          #8888a0 50%,
          transparent 70%
        );
        border-radius: 50%;
        box-shadow: 0 0 60px 30px rgba(150, 150, 180, 0.3),
          0 0 100px 60px rgba(100, 100, 130, 0.2);
        animation: flicker 4s ease-in-out infinite;
      }

      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
        }
        25% {
          opacity: 0.8;
        }
        50% {
          opacity: 0.95;
        }
        75% {
          opacity: 0.7;
        }
      }

      /* Fog layers */
      .fog {
        position: absolute;
        width: 200%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(40, 50, 50, 0.3) 25%,
          rgba(30, 40, 45, 0.4) 50%,
          rgba(40, 50, 50, 0.3) 75%,
          transparent 100%
        );
        animation: fogMove 20s linear infinite;
      }

      .fog-1 {
        bottom: 0;
        height: 40%;
        animation-duration: 25s;
      }

      .fog-2 {
        bottom: 10%;
        height: 30%;
        opacity: 0.6;
        animation-duration: 18s;
        animation-direction: reverse;
      }

      .fog-3 {
        bottom: 5%;
        height: 35%;
        opacity: 0.4;
        animation-duration: 30s;
      }

      @keyframes fogMove {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0%);
        }
      }

      /* Ground */
      .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 25%;
        background: linear-gradient(
          to top,
          #0a0d0a 0%,
          #121815 50%,
          transparent 100%
        );
      }

      /* Trees */
      .tree {
        position: absolute;
        bottom: 15%;
      }

      .tree-trunk {
        background: linear-gradient(
          to right,
          #1a1a1a 0%,
          #2a2520 50%,
          #1a1a1a 100%
        );
        transform-origin: bottom center;
      }

      .tree-1 {
        left: 5%;
      }
      .tree-1 .tree-trunk {
        width: 20px;
        height: 300px;
        transform: rotate(-5deg);
      }

      .tree-2 {
        left: 15%;
      }
      .tree-2 .tree-trunk {
        width: 25px;
        height: 400px;
        transform: rotate(3deg);
      }

      .tree-3 {
        right: 10%;
      }
      .tree-3 .tree-trunk {
        width: 22px;
        height: 350px;
        transform: rotate(-8deg);
      }

      .tree-4 {
        right: 25%;
      }
      .tree-4 .tree-trunk {
        width: 18px;
        height: 320px;
        transform: rotate(5deg);
      }

      /* Tree branches */
      .branch {
        position: absolute;
        background: #1a1815;
        transform-origin: left center;
      }

      .tree-1 .branch-1 {
        width: 80px;
        height: 6px;
        top: 50px;
        left: 15px;
        transform: rotate(-30deg);
      }

      .tree-1 .branch-2 {
        width: 60px;
        height: 5px;
        top: 100px;
        right: 20px;
        transform: rotate(40deg);
        transform-origin: right center;
      }

      .tree-2 .branch-1 {
        width: 100px;
        height: 7px;
        top: 80px;
        left: 20px;
        transform: rotate(-25deg);
      }

      .tree-2 .branch-2 {
        width: 70px;
        height: 5px;
        top: 150px;
        right: 25px;
        transform: rotate(35deg);
        transform-origin: right center;
      }

      .tree-3 .branch-1 {
        width: 90px;
        height: 6px;
        top: 60px;
        right: 18px;
        transform: rotate(30deg);
        transform-origin: right center;
      }

      .tree-4 .branch-1 {
        width: 75px;
        height: 5px;
        top: 70px;
        left: 15px;
        transform: rotate(-35deg);
      }

      /* Chapel */
      .chapel {
        position: absolute;
        bottom: 18%;
        left: 50%;
        transform: translateX(-50%) rotate(-3deg);
      }

      .chapel-body {
        width: 180px;
        height: 150px;
        background: linear-gradient(
          to right,
          #1a1815 0%,
          #252220 30%,
          #1f1d1a 70%,
          #151310 100%
        );
        position: relative;
        clip-path: polygon(0% 100%, 0% 20%, 50% 0%, 100% 20%, 100% 100%);
      }

      .chapel-door {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 70px;
        background: #0a0808;
        border-radius: 20px 20px 0 0;
      }

      .window {
        position: absolute;
        width: 30px;
        height: 50px;
        background: rgba(80, 10, 10, 0.8);
        border-radius: 15px 15px 0 0;
        box-shadow: inset 0 0 20px rgba(150, 20, 20, 0.8),
          0 0 30px rgba(120, 20, 20, 0.5);
        animation: windowGlow 3s ease-in-out infinite alternate;
      }

      .window-left {
        top: 40px;
        left: 25px;
      }

      .window-right {
        top: 40px;
        right: 25px;
      }

      .window-crack {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            45deg,
            transparent 45%,
            #0a0808 45%,
            #0a0808 55%,
            transparent 55%
          ),
          linear-gradient(
            -45deg,
            transparent 45%,
            #0a0808 45%,
            #0a0808 55%,
            transparent 55%
          );
      }

      @keyframes windowGlow {
        0% {
          box-shadow: inset 0 0 20px rgba(150, 20, 20, 0.8),
            0 0 30px rgba(120, 20, 20, 0.5);
        }
        100% {
          box-shadow: inset 0 0 30px rgba(180, 30, 30, 1),
            0 0 50px rgba(150, 30, 30, 0.7);
        }
      }

      .chapel-tower {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 80px;
        background: linear-gradient(
          to right,
          #1a1815 0%,
          #222018 50%,
          #151310 100%
        );
      }

      .chapel-spire {
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        border-bottom: 60px solid #1a1815;
      }

      /* Lantern */
      .lantern-branch {
        position: absolute;
        left: 30%;
        bottom: 45%;
        width: 100px;
        height: 8px;
        background: #1a1510;
        transform: rotate(15deg);
        transform-origin: left center;
      }

      .lantern {
        position: absolute;
        right: -10px;
        top: 5px;
        animation: sway 4s ease-in-out infinite;
        transform-origin: top center;
      }

      .lantern-handle {
        width: 20px;
        height: 15px;
        border: 3px solid #3a3025;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        margin: 0 auto;
      }

      .lantern-body {
        width: 30px;
        height: 40px;
        background: linear-gradient(to bottom, #2a2520, #1a1510);
        border: 2px solid #3a3025;
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }

      .lantern-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 15px;
        height: 20px;
        background: radial-gradient(
          ellipse,
          rgba(200, 150, 50, 0.8) 0%,
          rgba(150, 80, 20, 0.4) 50%,
          transparent 70%
        );
        animation: lanternFlicker 0.5s ease-in-out infinite;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }

      @keyframes lanternFlicker {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* Shadows */
      .shadow {
        position: absolute;
        background: rgba(0, 0, 0, 0.6);
        filter: blur(5px);
        animation: shadowPulse 8s ease-in-out infinite;
      }

      .shadow-1 {
        bottom: 20%;
        left: 20%;
        width: 80px;
        height: 150px;
        clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
        transform: skewX(-15deg);
        animation-delay: 0s;
      }

      .shadow-2 {
        bottom: 18%;
        right: 30%;
        width: 60px;
        height: 120px;
        clip-path: polygon(40% 0%, 60% 0%, 80% 100%, 20% 100%);
        transform: skewX(10deg);
        animation-delay: 2s;
      }

      .shadow-3 {
        bottom: 22%;
        left: 40%;
        width: 50px;
        height: 100px;
        clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        transform: skewX(-20deg);
        animation-delay: 4s;
      }

      @keyframes shadowPulse {
        0%,
        100% {
          opacity: 0.3;
          transform: skewX(-15deg) scaleY(1);
        }
        25% {
          opacity: 0.5;
          transform: skewX(-10deg) scaleY(1.1);
        }
        50% {
          opacity: 0.2;
          transform: skewX(-20deg) scaleY(0.9);
        }
        75% {
          opacity: 0.6;
          transform: skewX(-12deg) scaleY(1.05);
        }
      }

      /* Vignette effect */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0, 0, 0, 0.8) 100%
        );
        pointer-events: none;
      }

      /* Title */
      .title {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(100, 80, 80, 0.6);
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <!-- Moon -->
      <div class="moon"></div>

      <!-- Trees -->
      <div class="tree tree-1">
        <div class="tree-trunk">
          <div class="branch branch-1"></div>
          <div class="branch branch-2"></div>
        </div>
      </div>
      <div class="tree tree-2">
        <div class="tree-trunk">
          <div class="branch branch-1"></div>
          <div class="branch branch-2"></div>
        </div>
      </div>
      <div class="tree tree-3">
        <div class="tree-trunk">
          <div class="branch branch-1"></div>
        </div>
      </div>
      <div class="tree tree-4">
        <div class="tree-trunk">
          <div class="branch branch-1"></div>
        </div>
      </div>

      <!-- Lantern on branch -->
      <div class="lantern-branch">
        <div class="lantern">
          <div class="lantern-handle"></div>
          <div class="lantern-body">
            <div class="lantern-glow"></div>
          </div>
        </div>
      </div>

      <!-- Chapel -->
      <div class="chapel">
        <div class="chapel-tower">
          <div class="chapel-spire"></div>
        </div>
        <div class="chapel-body">
          <div class="window window-left">
            <div class="window-crack"></div>
          </div>
          <div class="window window-right">
            <div class="window-crack"></div>
          </div>
          <div class="chapel-door"></div>
        </div>
      </div>

      <!-- Mysterious shadows -->
      <div class="shadow shadow-1"></div>
      <div class="shadow shadow-2"></div>
      <div class="shadow shadow-3"></div>

      <!-- Ground -->
      <div class="ground"></div>

      <!-- Fog layers -->
      <div class="fog fog-1"></div>
      <div class="fog fog-2"></div>
      <div class="fog fog-3"></div>

      <!-- Vignette -->
      <div class="vignette"></div>

      <!-- Title -->
      <div class="title">The Forsaken Chapel</div>
    </div>
  </body>
</html>
