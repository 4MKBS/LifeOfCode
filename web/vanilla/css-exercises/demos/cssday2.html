<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Bouncing Ball Game</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #06b6d4;
            --text: #e6eef6;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
            background: linear-gradient(180deg, #071126 0%, #0b1a2a 100%);
            color: var(--text);
        }

        .wrap {
            max-width: 900px;
            margin: 28px auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: 0.6px;
        }

        .controls {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:active {
            transform: translateY(1px);
        }

        #hud {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
            font-size: 14px;
            color: #bcd7e6;
        }

        .area {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 6px 30px rgba(2, 6, 23, 0.6);
        }

        canvas {
            display: block;
            width: 100%;
            height: 520px;
            background: linear-gradient(180deg, #06202f, #00111a);
            border-radius: 8px;
        }

        .help {
            margin-top: 10px;
            color: #9fbfd1;
            font-size: 13px;
        }

        .small {
            font-size: 13px;
            color: #93c6d6;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Bouncing Ball — Keep it Alive</h1>
            <div class="controls">
                <button id="startBtn">Start</button>
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </header>

        <div class="area">
            <canvas id="game"></canvas>
            <div id="hud">
                <div>Score: <span id="score">0</span></div>
                <div>Lives: <span id="lives">3</span></div>
                <div class="small">Speed: <span id="speed">1.0x</span></div>
            </div>
            <div class="help">
                Controls: Move paddle with mouse or ← → keys. Ball bounces off walls and paddle. Lose a life if ball
                hits the bottom.
            </div>
        </div>
    </div>

    <script>
        // Minimal paddle-ball game
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // high-DPI handling
        function resize() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            const w = canvas.clientWidth;
            const h = canvas.clientHeight || 520;
            canvas.width = Math.floor(w * ratio);
            canvas.height = Math.floor(h * ratio);
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            gameWidth = w;
            gameHeight = h;
        }

        let gameWidth = 0, gameHeight = 0;
        resize();
        window.addEventListener('resize', resize);

        // game state
        let running = false;
        let last = 0;
        let score = 0;
        let lives = 3;
        let speedMultiplier = 1.0;

        // ball
        const ball = {
            x: 100, y: 100, r: 10,
            vx: 200, vy: 220, color: '#ffcc00'
        };

        // paddle
        const paddle = {
            w: 140, h: 14, x: 200, y: 0, color: '#06b6d4',
            speed: 600
        };
        paddle.y = 480;

        // input
        const keys = { left: false, right: false };
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });
        // mouse move for paddle
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            paddle.x = Math.max(0, Math.min(gameWidth - paddle.w, mx - paddle.w / 2));
        });

        // UI
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const speedEl = document.getElementById('speed');

        startBtn.addEventListener('click', () => { if (!running) start(); });
        pauseBtn.addEventListener('click', togglePause);
        resetBtn.addEventListener('click', resetGame);

        // core functions
        function start() {
            if (running) return;
            running = true;
            last = performance.now();
            requestAnimationFrame(loop);
        }

        function togglePause() {
            running = !running;
            if (running) { last = performance.now(); requestAnimationFrame(loop); }
        }

        function resetGame() {
            running = false;
            score = 0;
            lives = 3;
            speedMultiplier = 1.0;
            ball.r = 10;
            ball.x = gameWidth / 2;
            ball.y = gameHeight / 2;
            ball.vx = 200; ball.vy = 220;
            paddle.w = 140;
            paddle.x = (gameWidth - paddle.w) / 2;
            updateHUD();
            draw(); // one frame
        }

        function updateHUD() {
            scoreEl.textContent = String(score);
            livesEl.textContent = String(lives);
            speedEl.textContent = speedMultiplier.toFixed(2) + 'x';
        }

        function loop(now) {
            if (!running) return;
            const dt = Math.min(0.03, (now - last) / 1000);
            last = now;
            update(dt);
            draw();
            if (running) requestAnimationFrame(loop);
        }

        function update(dt) {
            // paddle movement via keys
            if (keys.left) paddle.x -= paddle.speed * dt;
            if (keys.right) paddle.x += paddle.speed * dt;
            paddle.x = Math.max(0, Math.min(gameWidth - paddle.w, paddle.x));

            // move ball
            ball.x += ball.vx * dt * speedMultiplier;
            ball.y += ball.vy * dt * speedMultiplier;

            // collisions with walls
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
            if (ball.x + ball.r > gameWidth) { ball.x = gameWidth - ball.r; ball.vx = -Math.abs(ball.vx); }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

            // collision with paddle
            if (ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                // reflect with angle depending on hit position
                const relative = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                const bounceAngle = relative * (Math.PI / 3); // ±60 degrees
                const speed = Math.hypot(ball.vx, ball.vy) * 1.03; // slight speed up on paddle hit
                ball.vx = speed * Math.sin(bounceAngle);
                ball.vy = -Math.abs(speed * Math.cos(bounceAngle));
                ball.y = paddle.y - ball.r - 0.1;
                score += 1;
                // increase difficulty occasionally
                if (score % 5 === 0) {
                    speedMultiplier += 0.08;
                    paddle.w = Math.max(70, paddle.w - 8);
                }
            }

            // bottom => lose life
            if (ball.y - ball.r > gameHeight) {
                lives -= 1;
                if (lives <= 0) {
                    running = false;
                    showGameOver();
                } else {
                    // reset ball to center but keep speed multiplier
                    ball.x = gameWidth / 2;
                    ball.y = gameHeight / 2;
                    ball.vx = (Math.random() > 0.5 ? 1 : -1) * 200;
                    ball.vy = 220;
                }
            }

            updateHUD();
        }

        function drawRoundedRect(x, y, w, h, r, fill) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        }

        function draw() {
            // clear
            ctx.clearRect(0, 0, gameWidth, gameHeight);

            // background subtle grid
            ctx.save();
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#ffffff';
            for (let gx = 0; gx < gameWidth; gx += 40) {
                ctx.fillRect(gx, 0, 1, gameHeight);
            }
            for (let gy = 0; gy < gameHeight; gy += 40) {
                ctx.fillRect(0, gy, gameWidth, 1);
            }
            ctx.restore();

            // draw paddle
            drawRoundedRect(paddle.x, paddle.y, paddle.w, paddle.h, 6, '#08454f');
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x + 4, paddle.y + 3, paddle.w - 8, paddle.h - 6);

            // draw ball with glow
            const g = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, ball.r * 3);
            g.addColorStop(0, '#fff8c0');
            g.addColorStop(0.2, ball.color);
            g.addColorStop(1, 'rgba(255,204,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
        }

        function showGameOver() {
            updateHUD();
            // draw final frame with overlay
            draw();
            ctx.fillStyle = 'rgba(2,6,23,0.65)';
            ctx.fillRect(0, 0, gameWidth, gameHeight);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.font = '24px system-ui,Segoe UI,Roboto';
            ctx.fillText('Game Over', gameWidth / 2, gameHeight / 2 - 10);
            ctx.font = '16px system-ui,Segoe UI,Roboto';
            ctx.fillStyle = '#b8e8ff';
            ctx.fillText('Score: ' + score + ' — Click Reset to play again', gameWidth / 2, gameHeight / 2 + 18);
        }

        // initialize
        resetGame();

        // keyboard shortcuts for quick start/pause
        window.addEventListener('keydown', e => {
            if (e.key === ' ') { e.preventDefault(); togglePause(); }
            if (e.key.toLowerCase() === 'r') resetGame();
            if (e.key.toLowerCase() === 's') start();
        });
    </script>
</body>

</html>
