<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-only Weather Card</title>
    <style>
      :root {
        --bg1: #1b2a4a;
        --bg2: #2f4f7a;
        --card: rgba(255, 255, 255, 0.12);
        --text: #f4f7fb;
        --muted: rgba(244, 247, 251, 0.75);
        --sun: #ffd86b;
        --cloud: #edf2f7;
        --rain: #7fd3ff;
        --shadow: rgba(0, 0, 0, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.15),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 15%,
            rgba(255, 255, 255, 0.1),
            transparent 20%
          ),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      .weather-card {
        width: min(92vw, 420px);
        border-radius: 28px;
        padding: 28px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.14);
        position: relative;
        overflow: hidden;
      }

      .weather-card::before {
        content: "";
        position: absolute;
        inset: auto -20% -40% auto;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.13),
          transparent 70%
        );
        pointer-events: none;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
      }

      .location h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: 0.2px;
      }

      .location p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .status {
        text-align: right;
        color: var(--muted);
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .center {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 18px;
        align-items: center;
      }

      .icon-wrap {
        width: 160px;
        height: 160px;
        position: relative;
        margin: 0 auto;
        filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.18));
      }

      .sun {
        position: absolute;
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 30% 30%,
          #fff7c4,
          var(--sun) 55%,
          #f9b800 100%
        );
        top: 18px;
        left: 16px;
        animation: float 5s ease-in-out infinite;
      }

      .sun::before {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg,
          rgba(255, 216, 107, 0.95) 0deg 8deg,
          transparent 8deg 20deg
        );
        -webkit-mask: radial-gradient(circle, transparent 42%, #000 43%);
        mask: radial-gradient(circle, transparent 42%, #000 43%);
        opacity: 0.95;
        animation: spin 18s linear infinite;
      }

      .cloud {
        position: absolute;
        width: 108px;
        height: 40px;
        background: var(--cloud);
        border-radius: 999px;
        bottom: 40px;
        left: 32px;
        animation: drift 6s ease-in-out infinite;
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: var(--cloud);
        border-radius: 50%;
      }

      .cloud::before {
        width: 54px;
        height: 54px;
        left: 14px;
        top: -28px;
      }

      .cloud::after {
        width: 42px;
        height: 42px;
        left: 54px;
        top: -20px;
      }

      .rain {
        position: absolute;
        left: 42px;
        bottom: 10px;
        width: 92px;
        height: 52px;
        background: linear-gradient(
            to bottom,
            transparent 0 8px,
            var(--rain) 8px 10px,
            transparent 10px 100%
          ),
          linear-gradient(
            to bottom,
            transparent 0 18px,
            var(--rain) 18px 20px,
            transparent 20px 100%
          ),
          linear-gradient(
            to bottom,
            transparent 0 4px,
            var(--rain) 4px 6px,
            transparent 6px 100%
          );
        background-size: 26px 100%, 26px 100%, 26px 100%;
        background-position: 0 0, 14px 0, 28px 0;
        background-repeat: repeat-x;
        opacity: 0.95;
        animation: rain 0.9s linear infinite;
      }

      .temp {
        line-height: 1;
      }

      .temp .value {
        display: block;
        font-size: 4.2rem;
        font-weight: 800;
        letter-spacing: -2px;
      }

      .temp .desc {
        display: block;
        margin-top: 8px;
        font-size: 1.15rem;
        color: var(--muted);
        font-weight: 500;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 24px;
      }

      .detail {
        padding: 14px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }

      .detail span {
        display: block;
      }

      .detail .label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 6px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }

      .detail .num {
        font-size: 1.05rem;
        font-weight: 700;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes drift {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(8px);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes rain {
        from {
          transform: translateY(0);
          opacity: 0.9;
        }
        to {
          transform: translateY(8px);
          opacity: 0.65;
        }
      }

      @media (max-width: 420px) {
        .weather-card {
          padding: 22px;
        }
        .center {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .icon-wrap {
          margin-bottom: 4px;
        }
        .temp .value {
          font-size: 3.6rem;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .status {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <section class="weather-card" aria-label="Weather card">
      <div class="top">
        <div class="location">
          <h1>Seattle</h1>
          <p>Pacific Northwest, USA</p>
        </div>
        <div class="status">
          Updated now<br />
          Partly rainy
        </div>
      </div>

      <div class="center">
        <div class="icon-wrap" aria-hidden="true">
          <div class="sun"></div>
          <div class="cloud"></div>
          <div class="rain"></div>
        </div>

        <div class="temp">
          <span class="value">18°</span>
          <span class="desc">Light rain with sunshine</span>
        </div>
      </div>

      <div class="details">
        <div class="detail">
          <span class="label">Humidity</span>
          <span class="num">68%</span>
        </div>
        <div class="detail">
          <span class="label">Wind</span>
          <span class="num">12 km/h</span>
        </div>
        <div class="detail">
          <span class="label">Feels like</span>
          <span class="num">17°</span>
        </div>
      </div>
    </section>
  </body>
</html>
