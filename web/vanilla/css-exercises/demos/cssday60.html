<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outline to Fill Hover Text</title>
    <style>
      :root {
        --bg: #0f172a;
        --stroke: #e2e8f0;
        --fill: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1e293b, var(--bg));
        font-family: Arial, Helvetica, sans-serif;
      }

      .hover-text {
        position: relative;
        font-size: clamp(2rem, 10vw, 7rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: transparent;
        -webkit-text-stroke: 2px var(--stroke);
        text-decoration: none;
        line-height: 1;
        display: inline-block;
      }

      .hover-text::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        width: 0%;
        overflow: hidden;
        white-space: nowrap;
        color: var(--fill);
        -webkit-text-stroke: 0;
        transition: width 450ms ease;
      }

      .hover-text:hover::after,
      .hover-text:focus-visible::after {
        width: 100%;
      }

      .hover-text:focus-visible {
        outline: 2px solid #94a3b8;
        outline-offset: 8px;
      }
    </style>
  </head>
  <body>
    <a class="hover-text" href="#" data-text="Hover Me">Hover Me</a>
  </body>
</html>
