<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow-layered Text</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #111827;
        --text: #f8fafc;
        --accent: #38bdf8;
        --shadow1: rgba(56, 189, 248, 0.7);
        --shadow2: rgba(15, 23, 42, 0.7);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1d4ed8 0%, transparent 32%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        font-family: "Segoe UI", Arial, sans-serif;
        overflow: hidden;
      }

      .wrap {
        position: relative;
        text-align: center;
        padding: 2rem;
      }

      .text {
        margin: 0;
        font-size: clamp(3rem, 12vw, 9rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
        line-height: 0.95;
        text-shadow: 1px 1px 0 var(--shadow1), 2px 2px 0 var(--shadow1),
          3px 3px 0 var(--shadow1), 4px 4px 0 var(--shadow2),
          5px 5px 0 var(--shadow2), 6px 6px 0 rgba(0, 0, 0, 0.35),
          10px 10px 18px rgba(0, 0, 0, 0.45), 0 0 24px rgba(56, 189, 248, 0.35);
        transform: skewX(-8deg);
      }

      .subtitle {
        margin-top: 1rem;
        color: rgba(248, 250, 252, 0.75);
        font-size: 0.95rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .glow {
        position: absolute;
        inset: auto 50% -2rem;
        width: min(70vw, 28rem);
        height: 8rem;
        transform: translateX(-50%);
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.35),
          transparent 70%
        );
        filter: blur(18px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="glow" aria-hidden="true"></div>
      <h1 class="text">Shadow</h1>
      <div class="subtitle">Layered Text Effect</div>
    </main>
  </body>
</html>
