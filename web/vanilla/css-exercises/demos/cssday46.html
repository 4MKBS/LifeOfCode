<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frosted Glass Effect</title>
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.14);
        --glass-border: rgba(255, 255, 255, 0.25);
        --text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.35),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 30%,
            rgba(120, 200, 255, 0.35),
            transparent 22%
          ),
          radial-gradient(
            circle at 30% 80%,
            rgba(255, 120, 180, 0.35),
            transparent 24%
          ),
          linear-gradient(135deg, #0f172a, #1e3a8a 45%, #7c3aed 100%);
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(12px);
        opacity: 0.7;
        pointer-events: none;
      }

      .blob.one {
        width: 220px;
        height: 220px;
        background: rgba(255, 255, 255, 0.35);
        top: 8%;
        left: 12%;
      }

      .blob.two {
        width: 260px;
        height: 260px;
        background: rgba(56, 189, 248, 0.35);
        right: 10%;
        bottom: 12%;
      }

      .blob.three {
        width: 180px;
        height: 180px;
        background: rgba(236, 72, 153, 0.3);
        bottom: 18%;
        left: 18%;
      }

      .glass-card {
        width: min(92vw, 420px);
        padding: 2rem;
        border-radius: 24px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
      }

      .tag {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        margin-bottom: 1rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.88);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .stat {
        padding: 1rem 0.8rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.14);
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: 1.35rem;
        margin-bottom: 0.25rem;
      }

      .button {
        display: inline-block;
        padding: 0.9rem 1.2rem;
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.9);
        color: #1e293b;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      }

      .button:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>

    <section class="glass-card" aria-label="Frosted glass card">
      <div class="tag">Frosted Glass</div>
      <h1>Clean, soft, and translucent.</h1>
      <p>
        A frosted glass effect uses transparency, blur, and subtle borders to
        create a modern layered interface.
      </p>

      <div class="stats">
        <div class="stat">
          <strong>18px</strong>
          <span>Blur</span>
        </div>
        <div class="stat">
          <strong>160%</strong>
          <span>Saturation</span>
        </div>
        <div class="stat">
          <strong>1px</strong>
          <span>Border</span>
        </div>
      </div>

      <a class="button" href="#">Explore Effect</a>
    </section>
  </body>
</html>
