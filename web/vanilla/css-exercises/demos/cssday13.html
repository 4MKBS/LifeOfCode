<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-muted: #636e72;
            --accent: #a29bfe;
            --accent-light: #dfe6e9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 20px;
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #eaeaea;
            --text-muted: #a0a0a0;
            --accent: #a29bfe;
            --accent-light: #2d3436;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Timer */
        .timer-display {
            font-size: 5rem;
            font-weight: 200;
            text-align: center;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .timer-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(162, 155, 254, 0.4);
        }

        .timer-btn.secondary {
            background: var(--accent-light);
            color: var(--text);
        }

        .timer-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .timer-settings label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .timer-settings input {
            width: 60px;
            padding: 8px;
            border: 2px solid var(--accent-light);
            border-radius: 10px;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        /* Progress Ring */
        .progress-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-ring {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                var(--accent) calc(var(--progress, 0) * 3.6deg),
                var(--accent-light) 0deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-ring::before {
            content: '';
            width: 160px;
            height: 160px;
            background: var(--card-bg);
            border-radius: 50%;
            position: absolute;
        }

        .progress-text {
            position: relative;
            z-index: 1;
            font-size: 2.5rem;
            font-weight: 300;
        }

        .progress-label {
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .sessions-count {
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 10px;
        }

        /* Tasks */
        .task-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--accent-light);
            border-radius: 15px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-task-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .add-task-btn:hover {
            transform: scale(1.05);
        }

        .task-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: var(--bg);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: grab;
            transition: all 0.2s;
        }

        .task-item:hover {
            transform: translateX(5px);
        }

        .task-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
        }

        .task-item.completed {
            opacity: 0.5;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .task-checkbox.checked {
            background: var(--accent);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
        }

        .delete-task {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .task-item:hover .delete-task {
            opacity: 1;
        }

        .delete-task:hover {
            color: #e74c3c;
        }

        /* Keyboard hint */
        .keyboard-hint {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        kbd {
            background: var(--card-bg);
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: var(--shadow);
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Focus Mode</h1>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>Pomodoro Timer</h2>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="timer-btn" id="startPauseBtn">Start</button>
                    <button class="timer-btn secondary" id="resetBtn">Reset</button>
                </div>
                <div class="timer-settings">
                    <label>
                        Work: <input type="number" id="workTime" value="25" min="1" max="60">
                    </label>
                    <label>
                        Break: <input type="number" id="breakTime" value="5" min="1" max="30">
                    </label>
                </div>
            </div>

            <div class="card">
                <h2>Daily Progress</h2>
                <div class="progress-container">
                    <div class="progress-ring" id="progressRing">
                        <span class="progress-text" id="progressText">0%</span>
                    </div>
                    <p class="progress-label">Sessions completed today</p>
                    <p class="sessions-count"><span id="sessionsCount">0</span> / 8</p>
                </div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h2>Tasks</h2>
                <div class="task-input-container">
                    <input type="text" class="task-input" id="taskInput" placeholder="Add a new task...">
                    <button class="add-task-btn" id="addTaskBtn">+</button>
                </div>
                <ul class="task-list" id="taskList"></ul>
            </div>
        </div>

        <p class="keyboard-hint">
            Press <kbd>Space</kbd> to start/pause timer • <kbd>R</kbd> to reset
        </p>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        // Timer
        let timerInterval = null;
        let timeLeft = 25 * 60;
        let isRunning = false;
        let isWorkSession = true;

        const timerDisplay = document.getElementById('timerDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const workTimeInput = document.getElementById('workTime');
        const breakTimeInput = document.getElementById('breakTime');

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            isRunning = true;
            startPauseBtn.textContent = 'Pause';
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isWorkSession) {
                        incrementSessions();
                        timeLeft = parseInt(breakTimeInput.value) * 60;
                        isWorkSession = false;
                    } else {
                        timeLeft = parseInt(workTimeInput.value) * 60;
                        isWorkSession = true;
                    }
                    updateTimerDisplay();
                    isRunning = false;
                    startPauseBtn.textContent = 'Start';
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            startPauseBtn.textContent = 'Start';
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            isWorkSession = true;
            timeLeft = parseInt(workTimeInput.value) * 60;
            updateTimerDisplay();
        }

        startPauseBtn.addEventListener('click', () => {
            isRunning ? pauseTimer() : startTimer();
        });

        resetBtn.addEventListener('click', resetTimer);

        workTimeInput.addEventListener('change', () => {
            if (!isRunning && isWorkSession) {
                timeLeft = parseInt(workTimeInput.value) * 60;
                updateTimerDisplay();
            }
        });

        // Sessions & Progress
        let sessions = parseInt(localStorage.getItem('sessions') || '0');
        const sessionsCount = document.getElementById('sessionsCount');
        const progressRing = document.getElementById('progressRing');
        const progressText = document.getElementById('progressText');

        function updateProgress() {
            const progress = Math.min((sessions / 8) * 100, 100);
            progressRing.style.setProperty('--progress', progress);
            progressText.textContent = `${Math.round(progress)}%`;
            sessionsCount.textContent = sessions;
        }

        function incrementSessions() {
            sessions++;
            localStorage.setItem('sessions', sessions);
            updateProgress();
        }

        updateProgress();

        // Tasks
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                li.draggable = true;
                li.dataset.index = index;
                li.innerHTML = `
                    <div class="task-checkbox ${task.completed ? 'checked' : ''}" data-index="${index}"></div>
                    <span class="task-text">${task.text}</span>
                    <button class="delete-task" data-index="${index}">×</button>
                `;
                taskList.appendChild(li);
            });
            setupDragAndDrop();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text, completed: false });
                saveTasks();
                renderTasks();
                taskInput.value = '';
            }
        }

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        taskList.addEventListener('click', (e) => {
            if (e.target.classList.contains('task-checkbox')) {
                const index = parseInt(e.target.dataset.index);
                tasks[index].completed = !tasks[index].completed;
                saveTasks();
                renderTasks();
            }
            if (e.target.classList.contains('delete-task')) {
                const index = parseInt(e.target.dataset.index);
                tasks.splice(index, 1);
                saveTasks();
                renderTasks();
            }
        });

        // Drag and Drop
        function setupDragAndDrop() {
            const items = taskList.querySelectorAll('.task-item');
            items.forEach(item => {
                item.addEventListener('dragstart', () => item.classList.add('dragging'));
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    const newOrder = [...taskList.querySelectorAll('.task-item')].map(
                        el => tasks[parseInt(el.dataset.index)]
                    );
                    tasks = newOrder;
                    saveTasks();
                    renderTasks();
                });
            });

            taskList.addEventListener('dragover', (e) => {
                e.preventDefault();
                const dragging = document.querySelector('.dragging');
                const siblings = [...taskList.querySelectorAll('.task-item:not(.dragging)')];
                const nextSibling = siblings.find(sibling => {
                    const box = sibling.getBoundingClientRect();
                    return e.clientY < box.top + box.height / 2;
                });
                taskList.insertBefore(dragging, nextSibling);
            });
        }

        renderTasks();

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                isRunning ? pauseTimer() : startTimer();
            }
            if (e.key.toLowerCase() === 'r') {
                resetTimer();
            }
        });
    </script>
</body>
</html>
