<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Masking with Images</title>
    <style>
      :root {
        --bg: #0f172a;
        --text-size: clamp(3rem, 12vw, 10rem);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
      }

      .masked-text {
        margin: 0;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: var(--text-size);
        line-height: 0.95;
        text-align: center;

        /* Image fill inside text */
        background: linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.25),
            rgba(255, 255, 255, 0) 35%
          ),
          url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80")
            center/cover no-repeat;

        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;

        /* Optional subtle movement */
        animation: pan 14s linear infinite alternate;
        filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.35));
        user-select: none;
      }

      @keyframes pan {
        from {
          background-position: 0% 50%, 40% 50%;
        }
        to {
          background-position: 100% 50%, 60% 50%;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="masked-text">Mask</h1>
  </body>
</html>
