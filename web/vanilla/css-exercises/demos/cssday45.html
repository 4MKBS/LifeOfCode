<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Pattern Background</title>
    <style>
      :root {
        --bg: #0f172a;
        --line: rgba(255, 255, 255, 0.08);
        --dot: rgba(255, 255, 255, 0.14);
        --accent: rgba(59, 130, 246, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
              circle at 1px 1px,
              var(--dot) 1px,
              transparent 0
            )
            0 0 / 24px 24px,
          linear-gradient(
              45deg,
              transparent 48%,
              var(--line) 49%,
              var(--line) 51%,
              transparent 52%
            )
            0 0 / 32px 32px,
          linear-gradient(
              -45deg,
              transparent 48%,
              var(--accent) 49%,
              var(--accent) 51%,
              transparent 52%
            )
            0 0 / 32px 32px,
          linear-gradient(180deg, #111827, var(--bg));
        overflow: hidden;
        color: white;
        font-family: system-ui, sans-serif;
      }

      .card {
        position: relative;
        z-index: 1;
        padding: 2rem 2.5rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        text-align: center;
        max-width: 28rem;
      }

      .card h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      .card p {
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.5;
      }

      .glow {
        position: fixed;
        inset: auto auto 10% 10%;
        width: 28rem;
        aspect-ratio: 1;
        background: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.22),
          transparent 70%
        );
        filter: blur(18px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="card">
      <h1>Pattern Background</h1>
      <p>Pure CSS background using layered gradients and no images.</p>
    </main>
  </body>
</html>
