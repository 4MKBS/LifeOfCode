<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>day 21</title>
    <style>
        body {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        main {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            padding: 32px 24px;
        }
        h1 {
            text-align: center;
            color: #f76d6d;
            margin-bottom: 32px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .card {
            background: #f9fafc;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 24px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 6px 24px rgba(247,109,109,0.15);
        }
        .card-icon {
            background: #f76d6d;
            color: #fff;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
        }
        .card-content {
            flex: 1;
        }
        .card-title {
            font-weight: bold;
            margin: 0 0 6px 0;
            color: #333;
        }
        .card-desc {
            margin: 0;
            color: #666;
            font-size: 0.97rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>CSS Day 21 - Exercise Demo</h1>
        <div>
            <div class="card">
                <div class="card-icon">🎨</div>
                <div class="card-content">
                    <div class="card-title">Modern UI</div>
                    <div class="card-desc">Clean, soft cards with subtle shadows and gradients.</div>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">⚡</div>
                <div class="card-content">
                    <div class="card-title">Responsive</div>
                    <div class="card-desc">Looks great on all devices and screen sizes.</div>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">💡</div>
                <div class="card-content">
                    <div class="card-title">Easy to Customize</div>
                    <div class="card-desc">Simple structure for quick modifications.</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
