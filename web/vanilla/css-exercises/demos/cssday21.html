<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Loading Spinner Variations</title>
    <style>
        body {
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            min-height: 100vh;
            justify-content: center;
            font-family: sans-serif;
        }

        .spinner {
            display: inline-block;
            margin: 20px;
        }

        /* Spinner 1: Classic rotating border */
        .spinner1 {
            width: 48px;
            height: 48px;
            border: 6px solid #eee;
            border-top: 6px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Spinner 2: Dots bouncing */
        .spinner2 {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 24px;
            gap: 8px;
        }
        .spinner2-dot {
            width: 12px;
            height: 12px;
            background: #28a745;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }
        .spinner2-dot:nth-child(2) { animation-delay: 0.2s; }
        .spinner2-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Spinner 3: Growing bars */
        .spinner3 {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            width: 40px;
            height: 32px;
        }
        .spinner3-bar {
            width: 6px;
            height: 12px;
            background: #fd7e14;
            border-radius: 3px;
            animation: grow 0.8s infinite;
        }
        .spinner3-bar:nth-child(2) { animation-delay: 0.2s; }
        .spinner3-bar:nth-child(3) { animation-delay: 0.4s; }
        .spinner3-bar:nth-child(4) { animation-delay: 0.6s; }

        /* Spinner 4: Dual ring */
        .spinner4 {
            width: 48px;
            height: 48px;
            border: 6px solid #20c997;
            border-radius: 50%;
            border-color: #20c997 transparent #20c997 transparent;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            to { transform: translateY(-12px); opacity: 0.7; }
        }

        @keyframes grow {
            0%, 100% { height: 12px; }
            50% { height: 28px; }
        }
    </style>
</head>
<body>
    <h2>CSS Loading Spinner Variations</h2>
    <div>
        <div class="spinner spinner1"></div>
        <div class="spinner spinner2">
            <div class="spinner2-dot"></div>
            <div class="spinner2-dot"></div>
            <div class="spinner2-dot"></div>
        </div>
        <div class="spinner spinner3">
            <div class="spinner3-bar"></div>
            <div class="spinner3-bar"></div>
            <div class="spinner3-bar"></div>
            <div class="spinner3-bar"></div>
        </div>
        <div class="spinner spinner4"></div>
    </div>
</body>
</html>
