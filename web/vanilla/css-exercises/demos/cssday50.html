<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated SVG Background</title>
    <style>
      :root {
        color-scheme: dark;
        --bg1: #07111f;
        --bg2: #0d1b2a;
        --accent: #7c3aed;
        --accent2: #22d3ee;
        --text: #e5eefb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at top,
          #13233a 0%,
          var(--bg1) 45%,
          #04070d 100%
        );
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
      }

      body {
        position: relative;
      }

      .background {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
        backdrop-filter: blur(0px);
      }

      .card {
        max-width: 720px;
        padding: 2.5rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(6, 12, 24, 0.28);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
        color: rgba(229, 238, 251, 0.82);
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(34, 211, 238, 0.14),
            transparent 30%
          ),
          radial-gradient(
            circle at 80% 30%,
            rgba(124, 58, 237, 0.16),
            transparent 32%
          ),
          radial-gradient(
            circle at 50% 80%,
            rgba(59, 130, 246, 0.1),
            transparent 35%
          );
        mix-blend-mode: screen;
        z-index: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <svg
      class="background"
      viewBox="0 0 1440 900"
      preserveAspectRatio="xMidYMid slice"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85" />
          <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
        </linearGradient>

        <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55" />
          <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2" />
        </linearGradient>

        <filter id="blur">
          <feGaussianBlur stdDeviation="24" />
        </filter>

        <filter id="softGlow">
          <feGaussianBlur stdDeviation="12" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
          <path
            d="M 80 0 L 0 0 0 80"
            fill="none"
            stroke="rgba(255,255,255,0.08)"
            stroke-width="1"
          />
        </pattern>
      </defs>

      <rect width="1440" height="900" fill="#050814" />
      <rect width="1440" height="900" fill="url(#grid)" opacity="0.35" />

      <g filter="url(#blur)" opacity="0.95">
        <circle cx="220" cy="180" r="140" fill="rgba(34,211,238,0.25)">
          <animate
            attributeName="cx"
            values="220;360;220"
            dur="12s"
            repeatCount="indefinite"
          />
          <animate
            attributeName="cy"
            values="180;240;180"
            dur="9s"
            repeatCount="indefinite"
          />
        </circle>

        <circle cx="1120" cy="220" r="190" fill="rgba(124,58,237,0.25)">
          <animate
            attributeName="cx"
            values="1120;980;1120"
            dur="14s"
            repeatCount="indefinite"
          />
          <animate
            attributeName="cy"
            values="220;330;220"
            dur="11s"
            repeatCount="indefinite"
          />
        </circle>

        <circle cx="780" cy="760" r="220" fill="rgba(96,165,250,0.18)">
          <animate
            attributeName="cx"
            values="780;860;780"
            dur="13s"
            repeatCount="indefinite"
          />
          <animate
            attributeName="cy"
            values="760;680;760"
            dur="10s"
            repeatCount="indefinite"
          />
        </circle>
      </g>

      <path fill="url(#waveGrad1)" opacity="0.9">
        <animate
          attributeName="d"
          dur="10s"
          repeatCount="indefinite"
          values="
                    M0,580 C180,500 290,680 470,620 C640,560 750,420 920,470 C1080,520 1200,650 1440,560 L1440,900 L0,900 Z;
                    M0,610 C220,690 300,500 500,560 C690,620 760,720 930,650 C1110,575 1220,460 1440,540 L1440,900 L0,900 Z;
                    M0,580 C180,500 290,680 470,620 C640,560 750,420 920,470 C1080,520 1200,650 1440,560 L1440,900 L0,900 Z
                "
        />
      </path>

      <path fill="url(#waveGrad2)" opacity="0.72">
        <animate
          attributeName="d"
          dur="14s"
          repeatCount="indefinite"
          values="
                    M0,680 C160,620 300,760 470,720 C630,680 760,560 930,590 C1110,620 1240,720 1440,650 L1440,900 L0,900 Z;
                    M0,710 C170,780 330,620 490,650 C660,680 790,800 960,740 C1130,670 1240,570 1440,620 L1440,900 L0,900 Z;
                    M0,680 C160,620 300,760 470,720 C630,680 760,560 930,590 C1110,620 1240,720 1440,650 L1440,900 L0,900 Z
                "
        />
      </path>

      <g filter="url(#softGlow)" opacity="0.9">
        <path
          d="M120 250 C290 120, 430 120, 590 250 S900 380, 1080 240 S1290 140, 1390 240"
          fill="none"
          stroke="rgba(255,255,255,0.18)"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <animate
            attributeName="stroke-dasharray"
            values="0,1200;220,1200;0,1200"
            dur="8s"
            repeatCount="indefinite"
          />
        </path>

        <path
          d="M90 360 C250 250, 400 260, 560 360 S860 500, 1040 350 S1280 220, 1380 340"
          fill="none"
          stroke="rgba(34,211,238,0.22)"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <animate
            attributeName="stroke-dasharray"
            values="0,1200;180,1200;0,1200"
            dur="9s"
            repeatCount="indefinite"
          />
        </path>
      </g>

      <g opacity="0.75">
        <circle cx="300" cy="120" r="5" fill="#ffffff">
          <animate
            attributeName="cy"
            values="120;150;120"
            dur="4s"
            repeatCount="indefinite"
          />
          <animate
            attributeName="opacity"
            values="0.4;1;0.4"
            dur="4s"
            repeatCount="indefinite"
          />
        </circle>
        <circle cx="1160" cy="110" r="4" fill="#22d3ee">
          <animate
            attributeName="cy"
            values="110;140;110"
            dur="5s"
            repeatCount="indefinite"
          />
        </circle>
        <circle cx="980" cy="520" r="3.5" fill="#8b5cf6">
          <animate
            attributeName="cx"
            values="980;1040;980"
            dur="6s"
            repeatCount="indefinite"
          />
        </circle>
        <circle cx="140" cy="700" r="4.5" fill="#60a5fa">
          <animate
            attributeName="cx"
            values="140;210;140"
            dur="7s"
            repeatCount="indefinite"
          />
        </circle>
      </g>
    </svg>

    <div class="glow"></div>

    <main class="content">
      <section class="card">
        <h1>Animated SVG Background</h1>
        <p>
          A lightweight, fully responsive background using SVG gradients,
          animated paths, and soft glow effects.
        </p>
      </section>
    </main>
  </body>
</html>
