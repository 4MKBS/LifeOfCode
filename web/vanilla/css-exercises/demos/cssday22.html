<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Skeleton Loading Screen</title>
    <style>
      body {
        background: #f4f4f4;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
      }
      .dashboard-skeleton {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        padding: 2.5rem 2rem;
        max-width: 900px;
        margin: 2rem auto;
      }
      .skeleton {
        background: linear-gradient(90deg, #eee 25%, #e0e0e0 50%, #eee 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite linear;
        border-radius: 6px;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2.5rem;
      }
      .skeleton.logo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
      }
      .skeleton.header-title {
        width: 220px;
        height: 28px;
        margin-left: 1.5rem;
      }
      .dashboard-cards {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      .skeleton.card {
        flex: 1;
        height: 100px;
        border-radius: 10px;
      }
      .dashboard-table {
        margin-bottom: 2rem;
      }
      .skeleton.table-header {
        width: 180px;
        height: 20px;
        margin-bottom: 1.2rem;
      }
      .dashboard-table-rows {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .skeleton.table-row {
        width: 100%;
        height: 18px;
        border-radius: 5px;
      }
      .dashboard-sidebar {
        position: absolute;
        left: 0;
        top: 0;
        width: 60px;
        height: 100vh;
        background: #eaeaea;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 2rem;
        gap: 1.5rem;
      }
      .skeleton.sidebar-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      @media (max-width: 900px) {
        .dashboard-skeleton {
          max-width: 98vw;
          padding: 1rem;
        }
        .dashboard-cards {
          flex-direction: column;
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-sidebar">
      <div class="skeleton sidebar-icon"></div>
      <div class="skeleton sidebar-icon"></div>
      <div class="skeleton sidebar-icon"></div>
      <div class="skeleton sidebar-icon"></div>
    </div>
    <div class="dashboard-skeleton" style="margin-left: 80px">
      <div class="dashboard-header">
        <div style="display: flex; align-items: center">
          <div class="skeleton logo"></div>
          <div class="skeleton header-title"></div>
        </div>
        <div
          class="skeleton"
          style="width: 120px; height: 36px; border-radius: 18px"
        ></div>
      </div>
      <div class="dashboard-cards">
        <div class="skeleton card"></div>
        <div class="skeleton card"></div>
        <div class="skeleton card"></div>
        <div class="skeleton card"></div>
      </div>
      <div class="dashboard-table">
        <div class="skeleton table-header"></div>
        <div class="dashboard-table-rows">
          <div class="skeleton table-row"></div>
          <div class="skeleton table-row"></div>
          <div class="skeleton table-row"></div>
          <div class="skeleton table-row"></div>
          <div class="skeleton table-row" style="width: 80%"></div>
        </div>
      </div>
      <div
        class="skeleton"
        style="width: 180px; height: 18px; margin-top: 2rem"
      ></div>
    </div>
  </body>
</html>
