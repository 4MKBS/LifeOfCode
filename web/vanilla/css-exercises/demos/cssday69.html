<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Breadcrumb</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
      }

      .breadcrumb-wrap {
        width: min(920px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.72);
        box-shadow: 0 20px 60px var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(14px);
      }

      .title {
        margin: 0 0 18px;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      nav[aria-label="Breadcrumb"] {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0;
      }

      .crumb {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 52px;
        padding: 0 24px 0 30px;
        color: var(--text);
        text-decoration: none;
        background: linear-gradient(180deg, #1f2937, #111827);
        clip-path: polygon(
          0 0,
          calc(100% - 18px) 0,
          100% 50%,
          calc(100% - 18px) 100%,
          0 100%,
          18px 50%
        );
        margin-left: -8px;
        transition: transform 220ms ease, background 220ms ease,
          color 220ms ease, filter 220ms ease;
        animation: slideIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .crumb:first-child {
        margin-left: 0;
        padding-left: 24px;
        clip-path: polygon(
          0 0,
          calc(100% - 18px) 0,
          100% 50%,
          calc(100% - 18px) 100%,
          0 100%
        );
      }

      .crumb:hover,
      .crumb:focus-visible {
        outline: none;
        transform: translateY(-2px);
        background: linear-gradient(
          180deg,
          rgba(56, 189, 248, 0.24),
          rgba(34, 197, 94, 0.16)
        );
        color: #fff;
        z-index: 2;
        filter: drop-shadow(0 10px 20px rgba(56, 189, 248, 0.12));
      }

      .crumb.active {
        background: linear-gradient(
          180deg,
          rgba(56, 189, 248, 0.34),
          rgba(59, 130, 246, 0.22)
        );
        color: white;
        z-index: 1;
      }

      .crumb .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        margin-right: 10px;
        background: currentColor;
        opacity: 0.85;
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.04);
        animation: pulse 2.2s ease-in-out infinite;
      }

      .separator {
        width: 10px;
        flex: 0 0 10px;
        position: relative;
        z-index: 3;
        margin-left: -2px;
        margin-right: -2px;
      }

      .separator::before {
        content: "";
        display: block;
        width: 8px;
        height: 8px;
        border-top: 2px solid rgba(148, 163, 184, 0.85);
        border-right: 2px solid rgba(148, 163, 184, 0.85);
        transform: rotate(45deg);
        margin: auto;
        animation: arrowBounce 1.8s ease-in-out infinite;
      }

      .note {
        margin: 18px 2px 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
      }

      @keyframes arrowBounce {
        0%,
        100% {
          transform: rotate(45deg) translate(0, 0);
          opacity: 0.65;
        }
        50% {
          transform: rotate(45deg) translate(2px, -2px);
          opacity: 1;
        }
      }

      .crumb:nth-child(1) {
        animation-delay: 0.05s;
      }
      .crumb:nth-child(3) {
        animation-delay: 0.12s;
      }
      .crumb:nth-child(5) {
        animation-delay: 0.19s;
      }
      .crumb:nth-child(7) {
        animation-delay: 0.26s;
      }

      @media (max-width: 640px) {
        .breadcrumb-wrap {
          padding: 22px;
        }

        .crumb {
          height: 46px;
          padding: 0 18px 0 24px;
          font-size: 0.95rem;
        }

        .crumb:first-child {
          padding-left: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="breadcrumb-wrap">
      <h1 class="title">Animated Breadcrumb</h1>

      <nav aria-label="Breadcrumb">
        <a class="crumb" href="#">
          <span class="dot"></span>
          Home
        </a>
        <span class="separator" aria-hidden="true"></span>
        <a class="crumb" href="#">
          <span class="dot"></span>
          Dashboard
        </a>
        <span class="separator" aria-hidden="true"></span>
        <a class="crumb" href="#">
          <span class="dot"></span>
          Projects
        </a>
        <span class="separator" aria-hidden="true"></span>
        <span class="crumb active" aria-current="page">
          <span class="dot"></span>
          CSS Exercises
        </span>
      </nav>

      <p class="note">Hover each item to see the motion effect.</p>
    </main>
  </body>
</html>
