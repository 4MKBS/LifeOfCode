<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-only Pie Chart</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --a: #38bdf8;
        --b: #f472b6;
        --c: #f59e0b;
        --d: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg) 60%);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .panel {
        width: min(92vw, 760px);
        padding: 32px;
        border-radius: 24px;
        background: color-mix(in srgb, var(--card) 88%, black);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        display: grid;
        gap: 28px;
        grid-template-columns: 280px 1fr;
        align-items: center;
      }

      .chart {
        --v1: 42;
        --v2: 25;
        --v3: 18;
        --v4: 15;

        width: 280px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: conic-gradient(
          var(--a) 0 calc(var(--v1) * 1%),
          var(--b) calc(var(--v1) * 1%) calc((var(--v1) + var(--v2)) * 1%),
          var(--c) calc((var(--v1) + var(--v2)) * 1%)
            calc((var(--v1) + var(--v2) + var(--v3)) * 1%),
          var(--d) calc((var(--v1) + var(--v2) + var(--v3)) * 1%) 100%
        );
        position: relative;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.25));
      }

      .chart::after {
        content: "";
        position: absolute;
        inset: 22%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #1f2937, #0b1220 70%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      .center-label {
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        text-align: center;
        pointer-events: none;
      }

      .center-label strong {
        display: block;
        font-size: 2rem;
        line-height: 1;
      }

      .center-label span {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .legend h1 {
        margin: 0 0 8px;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .legend p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .items {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      .items li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
      }

      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        flex: none;
      }

      .name {
        flex: 1;
      }
      .value {
        color: var(--muted);
      }

      .a {
        background: var(--a);
      }
      .b {
        background: var(--b);
      }
      .c {
        background: var(--c);
      }
      .d {
        background: var(--d);
      }

      @media (max-width: 700px) {
        .panel {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        .legend {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-label="CSS-only pie chart demo">
      <section class="chart" aria-label="Pie chart">
        <div class="center-label">
          <strong>100%</strong>
          <span>usage</span>
        </div>
      </section>

      <section class="legend">
        <h1>CSS-only pie chart</h1>
        <p>
          Created with a single <code>conic-gradient</code> and no JavaScript.
        </p>

        <ul class="items" aria-label="Chart legend">
          <li>
            <span class="swatch a"></span><span class="name">Design</span
            ><span class="value">42%</span>
          </li>
          <li>
            <span class="swatch b"></span><span class="name">Development</span
            ><span class="value">25%</span>
          </li>
          <li>
            <span class="swatch c"></span><span class="name">Testing</span
            ><span class="value">18%</span>
          </li>
          <li>
            <span class="swatch d"></span><span class="name">Deployment</span
            ><span class="value">15%</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
