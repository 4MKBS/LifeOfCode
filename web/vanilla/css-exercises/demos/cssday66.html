<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success Checkmark Animation</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --card: rgba(255, 255, 255, 0.08);
        --stroke: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
        background: radial-gradient(
          circle at 20% 20%,
          #334155 0%,
          var(--bg-1) 45%,
          #020617 100%
        );
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        padding: 2rem 1.8rem;
        border-radius: 22px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.12),
          var(--card)
        );
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        text-align: center;
      }

      .icon-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        margin: 0 auto 1.2rem;
        display: grid;
        place-items: center;
      }

      .pulse-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(34, 197, 94, 0.45);
        animation: pulse 1.8s ease-out infinite;
      }

      .pulse-ring:nth-child(2) {
        animation-delay: 0.4s;
      }

      .check-svg {
        width: 94px;
        height: 94px;
      }

      .circle {
        fill: none;
        stroke: var(--stroke);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-dasharray: 283;
        stroke-dashoffset: 283;
        animation: drawCircle 0.9s ease forwards;
        filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.4));
      }

      .check {
        fill: none;
        stroke: #dcfce7;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: drawCheck 0.5s 0.75s ease forwards;
      }

      h1 {
        margin: 0.4rem 0 0.4rem;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @keyframes drawCircle {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes drawCheck {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.7);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.45);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="card" aria-live="polite">
      <div class="icon-wrap" aria-hidden="true">
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>

        <svg class="check-svg" viewBox="0 0 100 100">
          <circle class="circle" cx="50" cy="50" r="45"></circle>
          <path class="check" d="M30 52 L45 67 L72 38"></path>
        </svg>
      </div>

      <h1>Success!</h1>
      <p>Your operation has been completed successfully.</p>
    </section>
  </body>
</html>
