<!DOCTYPE html>
<html lang="en">

<head></head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ellipse Ring</title>
<style>
    :root {
        --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        /* purple gradient background */
        --stroke: rgba(255, 215, 0, 0.95);
        /* golden stroke */
        --stroke-hover: rgba(0, 255, 255, 0.98);
        /* cyan on hover */
        --glow-color: rgba(255, 215, 0, 0.6);
        /* golden glow */
        --glow-hover: rgba(0, 255, 255, 0.7);
        /* cyan glow on hover */
        --count: 60;
        --size-w: 520px;
        --size-h: 360px;
        --thickness: 2px;
    }

    html,
    body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
    }

    .canvas {
        width: 720px;
        height: 720px;
        position: relative;
        display: block;
    }

    /* one ellipse template, we'll create many with JS */
    .ellipse {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--size-w);
        height: var(--size-h);
        transform-origin: center center;
        transform: translate(-50%, -50%) rotate(0deg);
        border-radius: 50% / 45%;
        /* make elliptical shape */
        border: var(--thickness) solid var(--stroke);
        background: transparent;
        box-sizing: border-box;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.98;
        filter: drop-shadow(0 0 8px var(--glow-color));
        /* Only transition specific properties for better performance */
        transition: border-radius 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55),
            border-color 0.6s ease-out,
            opacity 0.4s ease-out;
        will-change: border-radius, border-color;
    }

    /* a central cleared circle to create the visible hole */
    .hole {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 360px;
        height: 360px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
        pointer-events: none;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5),
            inset 0 0 60px rgba(255, 215, 0, 0.1);
        transition: border-radius 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55),
            transform 0.6s ease-out,
            box-shadow 0.4s ease-out;
        will-change: transform, border-radius;
    }

    /* Beautiful hover animation: transform to squares with cyan glow */
    .canvas:hover .ellipse {
        border-radius: 8%;
        /* Transform to rounded squares */
        border-width: 3px;
        border-color: var(--stroke-hover);
        filter: drop-shadow(0 0 15px var(--glow-hover)) drop-shadow(0 0 30px rgba(0, 255, 255, 0.4));
        opacity: 1;
    }

    .canvas:hover .hole {
        border-radius: 12%;
        /* Transform hole to rounded square */
        box-shadow: 0 0 60px rgba(0, 255, 255, 0.6),
            0 0 100px rgba(0, 255, 255, 0.4),
            inset 0 0 60px rgba(0, 255, 255, 0.2);
        transform: translate(-50%, -50%) scale(1.05);
        animation: pulse 2.5s ease-in-out infinite;
    }

    /* Smooth pulsing animation - optimized for performance */
    @keyframes pulse {

        0%,
        100% {
            transform: translate(-50%, -50%) scale(1.05);
        }

        50% {
            transform: translate(-50%, -50%) scale(1.07);
        }
    }
</style>
</head>

<body>
    <div class="canvas" id="canvas"></div>

    <script>
        // Generate many ellipses and vary rotation + subtle scale/skew for spirograph effect
        const canvas = document.getElementById('canvas');
        const count = 60; // matches --count in CSS (tweak)
        for (let i = 0; i < count; i++) {
            const e = document.createElement('div');
            e.className = 'ellipse';

            // base rotation step
            const rot = i * (360 / count) * 1.15; // 1.15 multiplies spacing for nicer overlaps

            // vary scale and vertical squash slightly to create interlacing curves
            const sx = 1 + Math.sin(i * 0.35) * 0.035;
            const sy = 1 + Math.cos(i * 0.25) * 0.03;

            // slight translate offset to break perfect symmetry
            const tx = Math.sin(i * 0.12) * 0.6;
            const ty = Math.cos(i * 0.11) * 0.6;

            e.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(${sx}, ${sy})`;

            // slightly reduce alpha for inner/outer rings (optional)
            e.style.opacity = 0.95 - (Math.abs(i - count / 2) / count) * 0.12;

            canvas.appendChild(e);
        }

        // add the central hole last so it's on top
        const hole = document.createElement('div');
        hole.className = 'hole';
        canvas.appendChild(hole);
    </script>
</body>

</html>
