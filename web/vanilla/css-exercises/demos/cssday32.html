<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masonry Layout</title>
    <style>
      :root {
        --gap: 12px;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f7fb;
      }
      .masonry {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-auto-rows: 45px;
        gap: var(--gap);
        padding: var(--gap);
        max-width: 1400px;
        margin: 0 auto;
      }
      .tile {
        text-align: center;
        padding: 10px;
        border-radius: var(--radius);
        background: var(--c, #8b5cf6);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .t1 {
        grid-column: 1/5;
        grid-row: 1/6;
      }
      .t2 {
        grid-column: 5/7;
        grid-row: 1/9;
      }
      .t3 {
        grid-column: 7/9;
        grid-row: 1/4;
      }
      .t4 {
        grid-column: 9/13;
        grid-row: 1/4;
      }
      .t5 {
        grid-column: 1/3;
        grid-row: 6/10;
      }
      .t6 {
        grid-column: 3/5;
      }
      .t7 {
        grid-column: 7/9;
        grid-row: 4 /9;
      }
      .t8 {
        grid-column: 9/10;
        grid-row: 4/7;
      }
      .t9 {
        grid-column: 3/5;
        grid-row: 7/10;
      }
      .t10 {
        grid-column: 5/9;
        grid-row: 9/13;
      }
      .t11 {
        grid-column: 1/5;
        grid-row: 10/13;
      }
      .t12 {
        grid-column: 10/13;
        grid-row: 4/7;
      }
      .t13 {
        grid-column: 9/13;
        grid-row: 7/12;
      }
      .t14 {
        grid-column: 9/13;
      }

      @media (max-width: 1024px) {
        .masonry {
          grid-template-columns: repeat(3, 1fr);
        }
        .tile {
          grid-column: auto;
          grid-row: auto;
        }
      }
      @media (max-width: 768px) {
        .masonry {
          grid-template-columns: repeat(2, 1fr);
        }
        .tile {
          grid-column: auto;
          grid-row: auto;
        }
      }
      @media (max-width: 520px) {
        .masonry {
          grid-template-columns: 1fr;
        }
        .tile {
          grid-column: auto;
          grid-row: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="masonry">
      <div class="tile t1" style="--c: #8b5cf6"></div>
      <div class="tile t2" style="--c: #2ea44f"></div>
      <div class="tile t3" style="--c: #5da9e9"></div>
      <div class="tile t4" style="--c: #2ea44f"></div>
      <div class="tile t5" style="--c: #e74c3c"></div>
      <div class="tile t6" style="--c: #5da9e9"></div>
      <div class="tile t7" style="--c: #e74c3c"></div>
      <div class="tile t8" style="--c: #8b5cf6"></div>
      <div class="tile t9" style="--c: #2ea44f"></div>
      <div class="tile t10" style="--c: #8b5cf6"></div>
      <div class="tile t11" style="--c: #8b5cf6"></div>
      <div class="tile t12" style="--c: #5da9e9"></div>
      <div class="tile t13" style="--c: #5da9e9"></div>
      <div class="tile t14" style="--c: #5da9e9"></div>
    </main>
    <script>
      const images = [
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1465101162946-4377e57745c3?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1465101162946-4377e57745c3?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1455218873509-8097305ee378?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80",
      ];

      document.querySelectorAll(".tile").forEach((tile, i) => {
        tile.style.backgroundImage = `url('${images[i % images.length]}')`;
        tile.style.backgroundColor = "transparent";
      });
    </script>
  </body>
</html>
