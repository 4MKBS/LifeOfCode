<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blurred Background Overlay</title>
    <style>
      :root {
        --bg1: #0b1020;
        --bg2: #111a35;
        --accent: #8b5cf6;
        --accent2: #22d3ee;
        --text: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        color: var(--text);
        background: radial-gradient(
            40rem 40rem at 15% 20%,
            rgba(139, 92, 246, 0.28),
            transparent 60%
          ),
          radial-gradient(
            35rem 35rem at 85% 80%,
            rgba(34, 211, 238, 0.25),
            transparent 60%
          ),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        overflow: hidden;
      }

      /* Soft "depth" blobs */
      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 28rem;
        height: 28rem;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        opacity: 0.55;
        pointer-events: none;
      }

      body::before {
        background: #7c3aed;
        top: -8rem;
        right: -6rem;
      }

      body::after {
        background: #06b6d4;
        bottom: -10rem;
        left: -8rem;
      }

      .overlay {
        position: relative;
        width: min(720px, 92vw);
        padding: 2.2rem;
        border-radius: 24px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.05)
        );
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(18px) saturate(130%);
        -webkit-backdrop-filter: blur(18px) saturate(130%);
        z-index: 1;
        isolation: isolate;
      }

      .overlay::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          130deg,
          rgba(255, 255, 255, 0.45),
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.3)
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        z-index: -1;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0;
        opacity: 0.9;
        line-height: 1.6;
        max-width: 60ch;
      }

      .chips {
        margin-top: 1.4rem;
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      .chip {
        padding: 0.48rem 0.8rem;
        border-radius: 999px;
        font-size: 0.82rem;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <section class="overlay">
      <h1>Deep Blur Overlay</h1>
      <p>
        Layered gradients, soft glow shapes, and glassmorphism blur combine to
        create a deep, cinematic UI panel.
      </p>
      <div class="chips">
        <span class="chip">Backdrop Blur</span>
        <span class="chip">Soft Shadows</span>
        <span class="chip">Depth Layers</span>
      </div>
    </section>
  </body>
</html>
