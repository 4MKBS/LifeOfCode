<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavy Text Animation</title>
    <style>
      :root {
        --bg1: #081120;
        --bg2: #121a33;
        --text: #f7fbff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at top, #22345f 0%, transparent 40%),
          radial-gradient(circle at bottom, #19324a 0%, transparent 35%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .wrap {
        text-align: center;
        padding: 2rem;
      }

      .wave {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0;
        font-size: clamp(2.5rem, 10vw, 7rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
        filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.35));
      }

      .wave span {
        display: inline-block;
        animation: bob 1.6s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.08s);
        color: hsl(calc(var(--i) * 18), 90%, 72%);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      .sub {
        margin-top: 1rem;
        font-size: 0.95rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-0.35em) rotate(-2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wave span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 class="wave" id="wave" aria-label="Wavy Text Animation">
        Wavy Text Animation
      </h1>
      <div class="sub">CSS animation demo</div>
    </main>

    <script>
      const wave = document.getElementById("wave");
      const text = wave.textContent;
      wave.textContent = "";

      [...text].forEach((char, i) => {
        const span = document.createElement("span");
        span.style.setProperty("--i", i);
        span.innerHTML = char === " " ? "&nbsp;" : char;
        wave.appendChild(span);
      });
    </script>
  </body>
</html>
