<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form Animation</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --card: rgba(15, 23, 42, 0.72);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent2: #a78bfa;
        --border: rgba(148, 163, 184, 0.22);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        color: var(--text);
        overflow: hidden;
        background: radial-gradient(
            circle at top left,
            rgba(56, 189, 248, 0.18),
            transparent 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(167, 139, 250, 0.18),
            transparent 35%
          ),
          linear-gradient(135deg, var(--bg1), var(--bg2));
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(10px);
        opacity: 0.5;
        animation: float 10s ease-in-out infinite;
        pointer-events: none;
      }

      .orb.one {
        width: 180px;
        height: 180px;
        background: rgba(56, 189, 248, 0.22);
        top: 8%;
        left: 8%;
      }

      .orb.two {
        width: 220px;
        height: 220px;
        background: rgba(167, 139, 250, 0.18);
        bottom: 8%;
        right: 10%;
        animation-delay: -3s;
      }

      .orb.three {
        width: 120px;
        height: 120px;
        background: rgba(34, 197, 94, 0.14);
        bottom: 16%;
        left: 18%;
        animation-delay: -6s;
      }

      .card {
        width: min(100%, 560px);
        position: relative;
        border-radius: 24px;
        padding: 2px;
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.8),
          rgba(167, 139, 250, 0.8),
          rgba(34, 197, 94, 0.8)
        );
        box-shadow: var(--shadow);
        animation: borderGlow 6s linear infinite;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 24px;
        padding: 2px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.35),
          rgba(255, 255, 255, 0)
        );
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
      }

      .form-shell {
        position: relative;
        border-radius: 22px;
        background: var(--card);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 32px;
        overflow: hidden;
      }

      .form-shell::after {
        content: "";
        position: absolute;
        inset: auto -20% -35% auto;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.18),
          transparent 65%
        );
        animation: pulse 5s ease-in-out infinite;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        max-width: 42ch;
      }

      form {
        display: grid;
        gap: 18px;
        position: relative;
        z-index: 1;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .field {
        position: relative;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.55);
        color: var(--text);
        border-radius: 14px;
        padding: 18px 16px 14px;
        font: inherit;
        outline: none;
        transition: 0.25s ease;
        box-shadow: inset 0 0 0 1px transparent;
      }

      .field textarea {
        min-height: 140px;
        resize: vertical;
      }

      .field label {
        position: absolute;
        top: 16px;
        left: 16px;
        color: var(--muted);
        pointer-events: none;
        transition: 0.25s ease;
        background: transparent;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: rgba(56, 189, 248, 0.7);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
        transform: translateY(-1px);
      }

      .field input:focus + label,
      .field input:not(:placeholder-shown) + label,
      .field textarea:focus + label,
      .field textarea:not(:placeholder-shown) + label {
        top: 7px;
        font-size: 0.78rem;
        color: var(--accent);
      }

      .field input::placeholder,
      .field textarea::placeholder {
        color: transparent;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      button {
        position: relative;
        border: none;
        color: white;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        padding: 14px 20px;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.22);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent 20%,
          rgba(255, 255, 255, 0.35),
          transparent 80%
        );
        transform: translateX(-120%);
        transition: transform 0.7s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(139, 92, 246, 0.24);
      }

      button:hover::after {
        transform: translateX(120%);
      }

      .note {
        color: var(--muted);
        font-size: 0.92rem;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(1);
        }
        50% {
          transform: translateY(-20px) translateX(12px) scale(1.05);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.7;
        }
      }

      @keyframes borderGlow {
        0% {
          filter: hue-rotate(0deg);
        }
        100% {
          filter: hue-rotate(360deg);
        }
      }

      @media (max-width: 640px) {
        .form-shell {
          padding: 24px;
        }

        .row {
          grid-template-columns: 1fr;
        }

        body {
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <div class="card">
      <div class="form-shell">
        <h1>Contact Us</h1>
        <p>
          Send a message and get a quick response. The form uses smooth focus,
          floating labels, and animated accents.
        </p>

        <form>
          <div class="row">
            <div class="field">
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                required
              />
              <label for="name">Your Name</label>
            </div>

            <div class="field">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Your Email"
                required
              />
              <label for="email">Your Email</label>
            </div>
          </div>

          <div class="field">
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="Subject"
              required
            />
            <label for="subject">Subject</label>
          </div>

          <div class="field">
            <textarea
              id="message"
              name="message"
              placeholder="Message"
              required
            ></textarea>
            <label for="message">Message</label>
          </div>

          <div class="actions">
            <button type="submit">Send Message</button>
            <span class="note">We usually reply within 24 hours.</span>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
