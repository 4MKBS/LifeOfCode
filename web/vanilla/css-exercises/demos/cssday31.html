<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Photo Gallery</title>
    <style>
        :root {
            --gap: 12px;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 16px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 16px;
        }
        .gallery {
            display: grid;
            gap: var(--gap);
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            grid-auto-rows: 140px;
            grid-auto-flow: dense;
        }
        .card {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: #1e293b;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .card:hover img {
            transform: scale(1.06);
        }
        .wide {
            grid-column: span 2;
        }
        .tall {
            grid-row: span 2;
        }
        .big {
            grid-column: span 2;
            grid-row: span 2;
        }
        @media (max-width: 600px) {
            .wide, .big {
                grid-column: span 1;
            }
            .tall, .big {
                grid-row: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>CSS Grid Photo Gallery</h1>
        <div class="gallery">
            <div class="card big"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Forest" /></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80" alt="Mountains" /></div>
            <div class="card tall"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake" /></div>
            <div class="card wide"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Trees" /></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80" alt="Night sky" /></div>
            <div class="card tall"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Hills" /></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean" /></div>
            <div class="card wide"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" alt="Valley" /></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?auto=format&fit=crop&w=800&q=80" alt="Waterfall" /></div>
            <div class="card"><img src="https://images.unsplash.com/photo-1440589473619-3cde28941638?auto=format&fit=crop&w=800&q=80" alt="Desert" /></div>
        </div>
    </div>
</body>
</html>
