<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Accordion</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --accent: #22c55e;
        --border: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(
          circle at 20% 0%,
          #1e293b 0%,
          var(--bg) 60%
        );
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .accordion {
        width: min(720px, 100%);
        background: color-mix(in oklab, var(--card), black 8%);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      }

      .item + .item {
        border-top: 1px solid var(--border);
      }

      .trigger {
        width: 100%;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }

      .trigger:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .trigger:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .icon {
        width: 1.1rem;
        height: 1.1rem;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 220ms ease, border-color 220ms ease;
        margin-left: 12px;
        flex: 0 0 auto;
      }

      .trigger[aria-expanded="true"] .icon {
        transform: rotate(-135deg) translateY(-2px);
        border-color: var(--accent);
      }

      .content {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 260ms ease;
      }

      .content > div {
        overflow: hidden;
        padding: 0 18px;
        color: var(--muted);
      }

      .item.open .content {
        grid-template-rows: 1fr;
      }

      .item.open .content > div {
        padding-bottom: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        .icon,
        .content {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="accordion" id="accordion" aria-label="FAQ accordion">
      <article class="item open">
        <h3>
          <button
            id="acc-btn-1"
            class="trigger"
            aria-expanded="true"
            aria-controls="acc-panel-1"
          >
            What is an accordion UI?
            <span class="icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div
          id="acc-panel-1"
          class="content"
          role="region"
          aria-labelledby="acc-btn-1"
        >
          <div>
            An accordion is a stacked list of sections where each header can
            expand or collapse its related content.
          </div>
        </div>
      </article>

      <article class="item">
        <h3>
          <button
            id="acc-btn-2"
            class="trigger"
            aria-expanded="false"
            aria-controls="acc-panel-2"
          >
            Can only one section stay open?
            <span class="icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div
          id="acc-panel-2"
          class="content"
          role="region"
          aria-labelledby="acc-btn-2"
          hidden
        >
          <div>
            Yes. This demo uses single-open behavior: opening one section
            automatically closes the others.
          </div>
        </div>
      </article>

      <article class="item">
        <h3>
          <button
            id="acc-btn-3"
            class="trigger"
            aria-expanded="false"
            aria-controls="acc-panel-3"
          >
            Is this keyboard accessible?
            <span class="icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div
          id="acc-panel-3"
          class="content"
          role="region"
          aria-labelledby="acc-btn-3"
          hidden
        >
          <div>
            Yes. Native button elements are keyboard accessible by default (Tab,
            Enter, and Space).
          </div>
        </div>
      </article>
    </section>

    <script>
      const accordion = document.getElementById("accordion");
      const items = [...accordion.querySelectorAll(".item")];
      const triggers = [...accordion.querySelectorAll(".trigger")];

      function closeItem(item) {
        const btn = item.querySelector(".trigger");
        const panel = document.getElementById(
          btn.getAttribute("aria-controls")
        );
        item.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
        panel.hidden = true;
      }

      function openItem(item) {
        const btn = item.querySelector(".trigger");
        const panel = document.getElementById(
          btn.getAttribute("aria-controls")
        );
        item.classList.add("open");
        btn.setAttribute("aria-expanded", "true");
        panel.hidden = false;
      }

      accordion.addEventListener("click", (e) => {
        const btn = e.target.closest(".trigger");
        if (!btn) return;

        const item = btn.closest(".item");
        const isOpen = item.classList.contains("open");

        items.forEach(closeItem);
        if (!isOpen) openItem(item);
      });

      accordion.addEventListener("keydown", (e) => {
        const current = e.target.closest(".trigger");
        if (!current) return;

        const index = triggers.indexOf(current);
        if (index === -1) return;

        let nextIndex = null;

        if (e.key === "ArrowDown") nextIndex = (index + 1) % triggers.length;
        if (e.key === "ArrowUp")
          nextIndex = (index - 1 + triggers.length) % triggers.length;
        if (e.key === "Home") nextIndex = 0;
        if (e.key === "End") nextIndex = triggers.length - 1;

        if (nextIndex !== null) {
          e.preventDefault();
          triggers[nextIndex].focus();
        }
      });
    </script>
  </body>
</html>
