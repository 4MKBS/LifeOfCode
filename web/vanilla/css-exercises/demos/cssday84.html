<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessible Form Design</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --border: #d1d5db;
        --focus: #2563eb;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      main {
        max-width: 700px;
        margin: 2rem auto;
        padding: 1rem;
      }

      h1 {
        margin-top: 0;
      }

      form {
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        margin: 0 0 1rem;
        padding: 1rem;
      }

      legend {
        font-weight: 600;
        padding: 0 0.25rem;
      }

      .field {
        margin-bottom: 1rem;
      }

      label {
        display: inline-block;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .hint {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0.2rem 0 0.4rem;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.6rem 0.7rem;
      }

      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .required {
        color: var(--danger);
      }

      .inline {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .inline label {
        font-weight: 500;
        margin: 0;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
      }

      button {
        border: 1px solid transparent;
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        cursor: pointer;
      }

      button[type="submit"] {
        background: #1d4ed8;
        color: #fff;
      }

      button[type="reset"] {
        background: #f3f4f6;
        color: #111827;
        border-color: var(--border);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        border: 0;
        padding: 0;
        white-space: nowrap;
        clip-path: inset(50%);
        clip: rect(0 0 0 0);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contact form</h1>
      <p>Fields marked <span class="required">*</span> are required.</p>

      <form action="#" method="post" novalidate>
        <fieldset>
          <legend>Personal details</legend>

          <div class="field">
            <label for="name"
              >Full name
              <span class="required" aria-hidden="true">*</span></label
            >
            <input
              id="name"
              name="name"
              type="text"
              required
              autocomplete="name"
            />
          </div>

          <div class="field">
            <label for="email"
              >Email <span class="required" aria-hidden="true">*</span></label
            >
            <p id="email-hint" class="hint">
              Use a valid address, for example: name@example.com
            </p>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              aria-describedby="email-hint"
            />
          </div>

          <div class="field">
            <label for="topic">Topic</label>
            <select id="topic" name="topic">
              <option value="">Select one</option>
              <option>Support</option>
              <option>Feedback</option>
              <option>Partnership</option>
            </select>
          </div>
        </fieldset>

        <fieldset>
          <legend>Preferences</legend>

          <div class="field">
            <span id="contact-method-label">Preferred contact method</span>
            <div
              class="inline"
              role="group"
              aria-labelledby="contact-method-label"
            >
              <div>
                <input
                  id="contact-email"
                  type="radio"
                  name="contactMethod"
                  value="email"
                  checked
                />
                <label for="contact-email">Email</label>
              </div>
              <div>
                <input
                  id="contact-phone"
                  type="radio"
                  name="contactMethod"
                  value="phone"
                />
                <label for="contact-phone">Phone</label>
              </div>
            </div>
          </div>

          <div class="field">
            <input id="updates" type="checkbox" name="updates" />
            <label for="updates">Send me product updates</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="message"
            >Message <span class="required" aria-hidden="true">*</span></label
          >
          <p id="message-hint" class="hint">Minimum 20 characters.</p>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            minlength="20"
            aria-describedby="message-hint"
          ></textarea>
        </div>

        <p id="form-status" class="sr-only" aria-live="polite"></p>

        <div class="actions">
          <button type="submit">Send message</button>
          <button type="reset">Clear</button>
        </div>
      </form>
    </main>
  </body>
</html>
