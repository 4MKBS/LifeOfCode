<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .input-field:focus,
        .textarea-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .rating-star {
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #cbd5e0;
        }

        .rating-star:hover,
        .rating-star.active {
            color: #fbbf24;
            transform: scale(1.2);
        }

        .emoji-rating {
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        .emoji-rating:hover,
        .emoji-rating.active {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.2);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .feedback-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-animation {
            animation: successPop 0.5s ease-out;
        }

        @keyframes successPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card rounded-2xl shadow-2xl w-full max-w-4xl p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                💬 Feedback Form
            </h1>
            <p class="text-gray-600">We'd love to hear your thoughts and suggestions!</p>
        </div>

        <!-- Success Message -->
        <div id="successMessage"
            class="hidden bg-green-50 border-l-4 border-green-500 p-6 rounded-lg mb-8 success-animation">
            <div class="flex items-center">
                <span class="text-4xl mr-4">✅</span>
                <div>
                    <h3 class="text-green-900 font-bold text-xl mb-1">Thank You!</h3>
                    <p class="text-green-700">Your feedback has been submitted successfully.</p>
                </div>
            </div>
        </div>

        <!-- Feedback Form -->
        <form id="feedbackForm" class="mb-8">
            <!-- Personal Information -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="name" required
                        class="input-field w-full border-2 border-gray-300 rounded-lg p-3" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Email <span class="text-red-500">*</span>
                    </label>
                    <input type="email" id="email" required
                        class="input-field w-full border-2 border-gray-300 rounded-lg p-3"
                        placeholder="john@example.com">
                </div>
            </div>

            <!-- Feedback Category -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Feedback Category <span class="text-red-500">*</span>
                </label>
                <select id="category" required class="input-field w-full border-2 border-gray-300 rounded-lg p-3">
                    <option value="">Select a category</option>
                    <option value="general">General Feedback</option>
                    <option value="bug">Bug Report</option>
                    <option value="feature">Feature Request</option>
                    <option value="improvement">Improvement Suggestion</option>
                    <option value="complaint">Complaint</option>
                    <option value="praise">Praise</option>
                </select>
            </div>

            <!-- Star Rating -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    Overall Rating <span class="text-red-500">*</span>
                </label>
                <div class="flex justify-center gap-2" id="starRating">
                    <span class="rating-star" data-rating="1">★</span>
                    <span class="rating-star" data-rating="2">★</span>
                    <span class="rating-star" data-rating="3">★</span>
                    <span class="rating-star" data-rating="4">★</span>
                    <span class="rating-star" data-rating="5">★</span>
                </div>
                <p class="text-center text-gray-500 mt-2" id="ratingText">Select a rating</p>
                <input type="hidden" id="rating" required>
            </div>

            <!-- Emoji Satisfaction -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3 text-center">
                    How satisfied are you? 😊
                </label>
                <div class="flex justify-center gap-4" id="emojiRating">
                    <span class="emoji-rating" data-emoji="very-sad" title="Very Dissatisfied">😞</span>
                    <span class="emoji-rating" data-emoji="sad" title="Dissatisfied">😕</span>
                    <span class="emoji-rating" data-emoji="neutral" title="Neutral">😐</span>
                    <span class="emoji-rating" data-emoji="happy" title="Satisfied">😊</span>
                    <span class="emoji-rating" data-emoji="very-happy" title="Very Satisfied">😄</span>
                </div>
                <input type="hidden" id="satisfaction">
            </div>

            <!-- Feedback Message -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Your Feedback <span class="text-red-500">*</span>
                </label>
                <textarea id="message" required rows="6"
                    class="textarea-field w-full border-2 border-gray-300 rounded-lg p-3"
                    placeholder="Please share your detailed feedback here..."></textarea>
                <p class="text-xs text-gray-500 mt-1" id="charCount">0 / 500 characters</p>
            </div>

            <!-- Would Recommend -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    Would you recommend us to others?
                </label>
                <div class="flex gap-4">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="recommend" value="yes" class="mr-2">
                        <span class="text-gray-700">👍 Yes</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="recommend" value="no" class="mr-2">
                        <span class="text-gray-700">👎 No</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="recommend" value="maybe" class="mr-2">
                        <span class="text-gray-700">🤔 Maybe</span>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit w-full text-white font-bold py-4 rounded-lg shadow-lg">
                🚀 Submit Feedback
            </button>
        </form>

        <!-- Previous Feedback -->
        <div>
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-gray-800">📋 Previous Feedback</h3>
                <button onclick="clearFeedback()" class="text-sm text-red-600 hover:text-red-700 font-semibold">
                    🗑️ Clear All
                </button>
            </div>
            <div id="feedbackList" class="space-y-3 max-h-96 overflow-y-auto">
                <p class="text-center text-gray-400 py-8">No feedback submitted yet</p>
            </div>
        </div>
    </div>

    <script>
        let feedbackData = JSON.parse(localStorage.getItem('feedbackData')) || [];
        let selectedRating = 0;
        let selectedSatisfaction = '';

        // Star Rating
        const stars = document.querySelectorAll('.rating-star');
        const ratingTexts = ['Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];

        stars.forEach(star => {
            star.addEventListener('click', function () {
                selectedRating = parseInt(this.dataset.rating);
                document.getElementById('rating').value = selectedRating;
                updateStars();
                document.getElementById('ratingText').textContent = ratingTexts[selectedRating - 1];
            });

            star.addEventListener('mouseenter', function () {
                const rating = parseInt(this.dataset.rating);
                stars.forEach((s, index) => {
                    s.style.color = index < rating ? '#fbbf24' : '#cbd5e0';
                });
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', updateStars);

        function updateStars() {
            stars.forEach((star, index) => {
                if (index < selectedRating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // Emoji Rating
        const emojis = document.querySelectorAll('.emoji-rating');
        emojis.forEach(emoji => {
            emoji.addEventListener('click', function () {
                emojis.forEach(e => e.classList.remove('active'));
                this.classList.add('active');
                selectedSatisfaction = this.dataset.emoji;
                document.getElementById('satisfaction').value = selectedSatisfaction;
            });
        });

        // Character Count
        const messageField = document.getElementById('message');
        messageField.addEventListener('input', function () {
            const count = this.value.length;
            document.getElementById('charCount').textContent = `${count} / 500 characters`;
            if (count > 500) {
                this.value = this.value.substring(0, 500);
            }
        });

        // Form Submission
        document.getElementById('feedbackForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (!selectedRating) {
                alert('Please select a rating');
                return;
            }

            const formData = {
                id: Date.now(),
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                category: document.getElementById('category').value,
                rating: selectedRating,
                satisfaction: selectedSatisfaction,
                message: document.getElementById('message').value,
                recommend: document.querySelector('input[name="recommend"]:checked')?.value || 'not specified',
                date: new Date().toLocaleString()
            };

            feedbackData.unshift(formData);
            localStorage.setItem('feedbackData', JSON.stringify(feedbackData));

            // Show success message
            document.getElementById('successMessage').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('successMessage').classList.add('hidden');
            }, 5000);

            // Reset form
            this.reset();
            selectedRating = 0;
            selectedSatisfaction = '';
            updateStars();
            emojis.forEach(e => e.classList.remove('active'));
            document.getElementById('ratingText').textContent = 'Select a rating';
            document.getElementById('charCount').textContent = '0 / 500 characters';

            // Update display
            displayFeedback();

            // Scroll to success message
            document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        function displayFeedback() {
            const feedbackList = document.getElementById('feedbackList');

            if (feedbackData.length === 0) {
                feedbackList.innerHTML = '<p class="text-center text-gray-400 py-8">No feedback submitted yet</p>';
                return;
            }

            feedbackList.innerHTML = feedbackData.map(item => {
                const starDisplay = '⭐'.repeat(item.rating);
                const categoryColors = {
                    general: 'bg-blue-100 text-blue-800',
                    bug: 'bg-red-100 text-red-800',
                    feature: 'bg-green-100 text-green-800',
                    improvement: 'bg-yellow-100 text-yellow-800',
                    complaint: 'bg-orange-100 text-orange-800',
                    praise: 'bg-purple-100 text-purple-800'
                };

                return `
                    <div class="feedback-item p-4 rounded-lg">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-gray-800">${item.name}</h4>
                                <p class="text-sm text-gray-500">${item.email}</p>
                            </div>
                            <div class="text-right">
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${categoryColors[item.category] || 'bg-gray-100 text-gray-800'}">
                                    ${item.category}
                                </span>
                            </div>
                        </div>
                        <div class="mb-2">
                            <span class="text-yellow-500">${starDisplay}</span>
                            ${item.satisfaction ? `<span class="ml-2">${getEmojiFromSatisfaction(item.satisfaction)}</span>` : ''}
                        </div>
                        <p class="text-gray-700 mb-2">${item.message}</p>
                        <div class="flex justify-between items-center text-xs text-gray-500">
                            <span>Recommend: ${item.recommend}</span>
                            <span>${item.date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getEmojiFromSatisfaction(satisfaction) {
            const emojis = {
                'very-sad': '😞',
                'sad': '😕',
                'neutral': '😐',
                'happy': '😊',
                'very-happy': '😄'
            };
            return emojis[satisfaction] || '';
        }

        function clearFeedback() {
            if (confirm('Clear all feedback history?')) {
                feedbackData = [];
                localStorage.removeItem('feedbackData');
                displayFeedback();
            }
        }

        // Initial display
        displayFeedback();
    </script>
</body>

</html>
