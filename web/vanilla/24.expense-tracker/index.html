<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="min-h-screen p-4">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-5xl font-bold text-center text-white mb-8">💰 Expense Tracker</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="glass rounded-2xl p-6 text-center shadow-xl">
                <p class="text-gray-600 mb-2">Total Balance</p>
                <p class="text-4xl font-bold text-purple-600" id="balance">$0.00</p>
            </div>
            <div class="glass rounded-2xl p-6 text-center shadow-xl">
                <p class="text-gray-600 mb-2">Total Income</p>
                <p class="text-4xl font-bold text-green-600" id="income">$0.00</p>
            </div>
            <div class="glass rounded-2xl p-6 text-center shadow-xl">
                <p class="text-gray-600 mb-2">Total Expenses</p>
                <p class="text-4xl font-bold text-red-600" id="expenses">$0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Add Transaction -->
            <div class="glass rounded-2xl p-6 shadow-xl">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">➕ Add Transaction</h2>
                <form id="transactionForm" class="space-y-4">
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Description</label>
                        <input type="text" id="description" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="e.g., Salary, Groceries">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Amount</label>
                        <input type="number" step="0.01" id="amount" required
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none"
                            placeholder="0.00">
                    </div>
                    <div>
                        <label class="block font-semibold text-gray-700 mb-2">Category</label>
                        <select id="category"
                            class="w-full p-3 border-2 rounded-lg focus:border-purple-500 outline-none">
                            <option value="food">🍔 Food</option>
                            <option value="transport">🚗 Transport</option>
                            <option value="entertainment">🎬 Entertainment</option>
                            <option value="shopping">🛍️ Shopping</option>
                            <option value="bills">📄 Bills</option>
                            <option value="salary">💼 Salary</option>
                            <option value="other">📌 Other</option>
                        </select>
                    </div>
                    <div class="flex gap-3">
                        <button type="button" onclick="addTransaction('income')"
                            class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition-all">
                            ↑ Income
                        </button>
                        <button type="button" onclick="addTransaction('expense')"
                            class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-all">
                            ↓ Expense
                        </button>
                    </div>
                </form>
            </div>

            <!-- Transactions List -->
            <div class="glass rounded-2xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">📝 Transactions</h2>
                    <button onclick="clearAll()" class="text-red-600 hover:text-red-700 font-semibold">Clear
                        All</button>
                </div>
                <div id="transactionsList" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-center text-gray-400 py-8">No transactions yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function addTransaction(type) {
            const description = document.getElementById('description').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;

            if (!description || !amount) return alert('Please fill all fields');

            const transaction = {
                id: Date.now(),
                description,
                amount: type === 'expense' ? -Math.abs(amount) : Math.abs(amount),
                category,
                type,
                date: new Date().toLocaleDateString()
            };

            transactions.unshift(transaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));

            document.getElementById('transactionForm').reset();
            displayTransactions();
            updateSummary();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            displayTransactions();
            updateSummary();
        }

        function displayTransactions() {
            if (transactions.length === 0) {
                document.getElementById('transactionsList').innerHTML = '<p class="text-center text-gray-400 py-8">No transactions yet</p>';
                return;
            }

            document.getElementById('transactionsList').innerHTML = transactions.map(t => `
                <div class="bg-${t.type === 'income' ? 'green' : 'red'}-50 p-4 rounded-lg border-l-4 border-${t.type === 'income' ? 'green' : 'red'}-500">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800">${t.description}</h4>
                            <p class="text-sm text-gray-500">${t.category} • ${t.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-bold text-${t.type === 'income' ? 'green' : 'red'}-600">
                                ${t.type === 'income' ? '+' : ''}$${Math.abs(t.amount).toFixed(2)}
                            </p>
                            <button onclick="deleteTransaction(${t.id})" class="text-red-500 hover:text-red-700 text-sm mt-1">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateSummary() {
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expense = Math.abs(transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0));
            const balance = income - expense;

            document.getElementById('balance').textContent = `$${balance.toFixed(2)}`;
            document.getElementById('income').textContent = `$${income.toFixed(2)}`;
            document.getElementById('expenses').textContent = `$${expense.toFixed(2)}`;
        }

        function clearAll() {
            if (confirm('Clear all transactions?')) {
                transactions = [];
                localStorage.removeItem('transactions');
                displayTransactions();
                updateSummary();
            }
        }

        displayTransactions();
        updateSummary();
    </script>
</body>

</html>
