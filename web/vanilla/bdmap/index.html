    <script>
      const map = L.map("map", {
        zoomControl: true,
        attributionControl: false,
      }).setView([23.685, 90.3563], 7);

      map.setMaxBounds([
        [20.5, 87.5],
        [27.5, 93.5],
      ]);

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
        {
          attribution: "&copy; OpenStreetMap contributors & CartoDB",
          subdomains: "abcd",
          maxZoom: 18,
        }
      ).addTo(map);

      function getRandomColor() {
        const colors = [
          "#99fc00",
          "#00e5ff",
          "#ffa500",
          "#ff4c4c",
          "#9b59b6",
          "#00d084",
          "#ffce00",
          "#f78da7",
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      // Load both files: shapes + district names
      Promise.all([
        fetch("district_v2.geojson").then((res) => res.json()),
        fetch("bd-districts.json").then((res) => res.json()),
      ]).then(([geoData, districtData]) => {
        const nameMap = {};
        districtData.districts.forEach((dist) => {
          nameMap[dist.name] = dist.bn_name;
        });

        L.geoJSON(geoData, {
          style: () => ({
            color: "#008000",
            outline: "none",
            border: "none",
            weight: 1,
            fillColor: getRandomColor(),
            fillOpacity: 0.6,
          }),
          onEachFeature: function (feature, layer) {
            const englishName = feature.properties.DISTRICT_NAME || "";

            const banglaName = nameMap[englishName] || "Unnamed";
            if (banglaName === "Unnamed") {
              console.log("No Bangla name for:", englishName, feature);
            }
            layer.bindTooltip(banglaName, {
              direction: "center",
              className: "district-label",
              sticky: true,
            });
          },
        }).addTo(map);
      });
    </script>
