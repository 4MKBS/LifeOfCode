<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeleaf - Modern Time Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1 class="app-title">🍃 Timeleaf</h1>
        <div class="header-controls">
          <button class="settings-btn" id="settingsBtn" title="Settings">
            ⚙️
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Left Column: Clocks -->
        <section class="clocks-section">
          <!-- Analog Clock -->
          <div class="clock-card">
            <div class="analog-clock">
              <div class="clock-center"></div>
              <div class="hand hour-hand"></div>
              <div class="hand minute-hand"></div>
              <div class="hand second-hand"></div>
              <div class="clock-markers">
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
                <div class="marker"></div>
              </div>
            </div>
          </div>

          <!-- Digital Clock -->
          <div class="clock-card digital-clock-card">
            <div class="digital-display">
              <div class="digital-time" id="digitalTime">00:00:00</div>
              <div class="digital-ampm" id="digitalAMPM">AM</div>
            </div>
            <div class="digital-date" id="digitalDate">Monday, January 1</div>
          </div>
        </section>

        <!-- Middle Column: Calendar -->
        <section class="calendar-section">
          <div class="calendar-card">
            <div class="calendar-header">
              <button
                class="nav-btn prev-month"
                id="prevMonth"
                title="Previous month"
              >
                &lt;
              </button>
              <div class="current-date">
                <span class="month-year" id="monthYear">January 2026</span>
              </div>
              <button
                class="nav-btn next-month"
                id="nextMonth"
                title="Next month"
              >
                &gt;
              </button>
            </div>

            <div class="calendar-weekdays">
              <div class="weekday">Sun</div>
              <div class="weekday">Mon</div>
              <div class="weekday">Tue</div>
              <div class="weekday">Wed</div>
              <div class="weekday">Thu</div>
              <div class="weekday">Fri</div>
              <div class="weekday">Sat</div>
            </div>

            <div class="calendar-days" id="calendarDays"></div>

            <div class="calendar-shortcuts">
              <button class="shortcut-btn" id="todayBtn">Today</button>
            </div>
          </div>
        </section>

        <!-- Right Column: Time Tracker -->
        <section class="tracker-section">
          <div class="tracker-card">
            <h2 class="tracker-title">Time Tracker</h2>

            <!-- Add New Tracker -->
            <div class="tracker-input-section">
              <input
                type="datetime-local"
                id="trackerDateTime"
                class="tracker-input"
                title="Select start date and time"
              />
              <button class="add-tracker-btn" id="addTrackerBtn">
                Add Tracker
              </button>
            </div>

            <!-- Display Options -->
            <div class="display-options">
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showYears"
                  checked
                />
                <span>Years</span>
              </label>
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showMonths"
                  checked
                />
                <span>Months</span>
              </label>
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showDays"
                  checked
                />
                <span>Days</span>
              </label>
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showHours"
                  checked
                />
                <span>Hours</span>
              </label>
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showMinutes"
                  checked
                />
                <span>Minutes</span>
              </label>
              <label class="checkbox-label">
                <input
                  type="checkbox"
                  class="display-checkbox"
                  id="showSeconds"
                  checked
                />
                <span>Seconds</span>
              </label>
            </div>

            <!-- Trackers List -->
            <div class="trackers-list" id="trackersList">
              <div class="empty-state">
                <p>No trackers yet</p>
                <p class="empty-hint">Add a tracker to start tracking time</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="close-btn" id="closeSettingsBtn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label for="accentColor">Accent Color</label>
            <div class="color-picker">
              <input type="color" id="accentColor" class="color-input" />
              <span class="color-value" id="colorValue">#2D9C6F</span>
            </div>
          </div>

          <div class="setting-group">
            <label for="clockStyle">Clock Display</label>
            <select id="clockStyle" class="select-input">
              <option value="both">Analog & Digital</option>
              <option value="analog">Analog Only</option>
              <option value="digital">Digital Only</option>
            </select>
          </div>

          <div class="setting-group">
            <label for="theme">Theme</label>
            <select id="theme" class="select-input">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="auto">Auto</option>
            </select>
          </div>

          <div class="setting-group">
            <label>
              <input type="checkbox" id="use24Hour" />
              Use 24-hour format
            </label>
          </div>

          <div class="setting-group">
            <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
      <div class="modal-content small">
        <div class="modal-header">
          <h2>Delete Tracker?</h2>
        </div>
        <div class="modal-body">
          <p>This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
          <button class="btn-delete" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
